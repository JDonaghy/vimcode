name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux, headless)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # Cargo.toml has two path-deps on a *sibling* quadraui checkout:
    #   quadraui = { path = "../quadraui/quadraui" }
    #   vt100    = { path = "../quadraui/vendor/vt100-0.16.2-patched" }
    # actions/checkout cannot write outside the workspace, so clone it by hand.
    # quadraui is public and vendors the patched vt100, so no token is needed.
    - name: Check out quadraui (sibling path dependency)
      run: |
        git clone --depth 1 --branch develop \
          https://github.com/JDonaghy/quadraui.git \
          "$(dirname "$GITHUB_WORKSPACE")/quadraui"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # TEMPORARY (#615 diagnosis — remove before merge). The six render snapshots
    # pass on every dev box and fail here. Nothing has ever measured *why* from
    # inside the failing environment. Three questions, one run:
    #   1. which rustc/unicode-width does CI actually resolve?
    #   2. does the build re-resolve Cargo.lock (path-dep to a freshly cloned
    #      quadraui develop can invalidate it — `cargo test` has no --locked)?
    #   3. do the snapshots still fail once we know 1 and 2?
    - name: Diagnose resolution skew (#615)
      run: |
        echo "::group::toolchain"
        rustc --version && cargo --version
        echo "::endgroup::"
        echo "::group::unicode-width in the committed lock"
        grep -A2 'name = "unicode-width"' Cargo.lock || echo "ABSENT from lock"
        echo "::endgroup::"
        echo "::group::what cargo resolves for unicode-width"
        cargo tree -i unicode-width --no-default-features 2>&1 | head -40 || true
        echo "::endgroup::"
        echo "::group::did resolution rewrite Cargo.lock?"
        if git diff --exit-code --stat Cargo.lock; then
          echo "LOCK UNCHANGED — cargo honored the committed lock"
        else
          echo "LOCK REWRITTEN — cargo re-resolved; this is the skew"
          git diff Cargo.lock | head -60
        fi
        echo "::endgroup::"

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --no-default-features -- -D warnings

    - name: Build
      run: cargo build --no-default-features

    - name: Run tests
      run: cargo test --no-default-features
