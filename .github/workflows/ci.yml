name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux, headless)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # #691: quadraui is a git dependency pinned to a `rev` in Cargo.toml
    # (`quadraui = { git = ..., rev = ... }`), resolved and locked in
    # Cargo.lock. Cargo fetches it itself on the first cargo invocation below
    # — no separate checkout step needed. (Formerly a hand-cloned sibling path
    # dep pinned out-of-band via `quadraui-pin.txt`; see git history / #638 /
    # #625 for why that existed and why it was retired.)

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --no-default-features -- -D warnings

    - name: Build
      run: cargo build --no-default-features

    - name: Run tests
      run: |
        cargo test --no-default-features

  # #645: the job above compiles GTK OUT (`--no-default-features`), so a green
  # run there carries zero information about `src/gtk/`. This job is the lane
  # that actually compiles and tests the GTK backend. It runs headlessly — no
  # DISPLAY is set on a GitHub runner and none is needed: the `gtk::*` unit
  # tests paint into in-memory Cairo ImageSurfaces (the quadraui#301 GtkDriver
  # pattern) and nothing calls `gtk::init`. The `--no-default-features` job is
  # kept for the one thing this job can't prove: vimcode still builds on a
  # machine without GTK dev libs.
  test-gui:
    name: Test (Linux, headless, GUI feature on)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # #691: quadraui fetched by Cargo itself, same as the TUI job — see the
    # comment there.

    - name: Install GTK4 dev libraries
      run: |
        sudo apt-get update
        # #720: librsvg2-common ships the gdk-pixbuf SVG loader. It's only a
        # `Recommends` of libgtk-4-1 on Ubuntu, not a hard `Depends`, so
        # --no-install-recommends (below) does NOT pull it in on its own --
        # it must be listed explicitly. Without it, `Pixbuf::from_read` on
        # the app-icon SVG (src/gtk/util.rs) fails, and the two #720 icon
        # tests (src/gtk/testing.rs, src/gtk/util.rs) hard-fail rather than
        # exercising real rasterised pixels.
        sudo apt-get install -y --no-install-recommends libgtk-4-dev librsvg2-common

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        # Distinct key from the TUI job — the target dirs diverge (GTK crates).
        key: ${{ runner.os }}-cargo-build-target-gui-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests (GUI feature on, no DISPLAY)
      run: |
        # Guard the lane's whole point: this must be a headless run.
        test -z "${DISPLAY:-}" && test -z "${WAYLAND_DISPLAY:-}"
        cargo test
