name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # #639: the Rust toolchain every job installs, kept identical to the
  # `channel` in `rust-toolchain.toml` (which is what local builds use).
  # Pinned because ci.yml gates on `clippy -- -D warnings` and every Rust
  # stable release ships new lints -- with `@stable` here, a Rust release
  # could redden CI with zero code changes. `tests/toolchain_pin.rs` fails
  # the build if this drifts from rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.1"
  # #865: the Neovim that tests/nvim_conformance.rs uses as its oracle. Must be
  # >= `MIN_NVIM_VERSION` in that file (0.12), and should match the fleet
  # standard installed on every agent host so CI and the fleet judge Vim
  # behaviour with the same binary. `ubuntu-24.04`'s apt ships 0.9.5, which is
  # below the floor, so both jobs install this pinned upstream tarball instead.
  NVIM_ORACLE_VERSION: v0.12.5

jobs:
  test:
    name: Test (Linux, headless)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # #691: quadraui is a git dependency pinned to a `rev` in Cargo.toml
    # (`quadraui = { git = ..., rev = ... }`), resolved and locked in
    # Cargo.lock. Cargo fetches it itself on the first cargo invocation below
    # — no separate checkout step needed. (Formerly a hand-cloned sibling path
    # dep pinned out-of-band via `quadraui-pin.txt`; see git history / #638 /
    # #625 for why that existed and why it was retired.)

    # #795/#865: tests/nvim_conformance.rs is the only test that validates
    # VimCode against real Vim behaviour. It's a default integration test
    # compiled in this (`--no-default-features`) lane too, and since #865 it
    # hard-fails on EVERY lane if nvim is missing or older than its declared
    # `MIN_NVIM_VERSION` — so this install step is load-bearing, not optional.
    # Do not swap it back to `apt-get install neovim`: ubuntu-24.04 apt ships
    # 0.9.5, which is below the floor and would fail the job.
    - name: Install Neovim ${{ env.NVIM_ORACLE_VERSION }} (oracle for tests/nvim_conformance.rs)
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/nvim.tar.gz \
          "https://github.com/neovim/neovim/releases/download/${NVIM_ORACLE_VERSION}/nvim-linux-x86_64.tar.gz"
        sudo tar -C /opt -xzf /tmp/nvim.tar.gz
        echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

    - name: Verify the conformance oracle
      run: nvim --version | head -1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --no-default-features -- -D warnings

    - name: Build
      run: cargo build --no-default-features

    - name: Run tests
      run: |
        cargo test --no-default-features

  # #1646: `tests/smoke-spec/*.yaml` are consumed by claude-coordinator's
  # Tier-2 real-platform acceptance drivers (`coord/tui_pty_driver.py`,
  # `coord/win_native_driver.py`, `coord/mac_native_driver.py`,
  # `coord/gtk_native_driver.py`), which this repo does not vendor. This job
  # only proves the specs still *parse* against those drivers' own loaders —
  # it cannot run them (no pty/native OS to drive here) — so a future driver
  # change that silently stops accepting a step shape this repo relies on is
  # caught here instead of only discovered the next time someone runs a real
  # acceptance pass. `scripts/validate_smoke_specs.py` does the importing;
  # this step only installs its one dependency and runs it.
  test-smoke-specs:
    name: Validate Tier-2 smoke specs
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # Floor, not an exact pin: the four `parse_*_spec` entry points this job
    # imports first shipped together in 0.5.551, and tracking the latest
    # release above that floor is the whole point — a driver change that stops
    # accepting a step shape these specs use should redden *this* lane, which
    # is a required check (.github/branch-protection.json), rather than be
    # discovered mid-acceptance-pass on fleet hardware.
    - name: Install code-coordinator
      run: pip install --quiet 'code-coordinator>=0.5.551'

    - name: Validate tests/smoke-spec/*.yaml against coord's real spec loaders
      run: python3 scripts/validate_smoke_specs.py

  # #645: the job above compiles GTK OUT (`--no-default-features`), so a green
  # run there carries zero information about `src/gtk/`. This job is the lane
  # that actually compiles and tests the GTK backend. It runs headlessly — no
  # DISPLAY is set on a GitHub runner and none is needed: the `gtk::*` unit
  # tests paint into in-memory Cairo ImageSurfaces (the quadraui#301 GtkDriver
  # pattern) and nothing calls `gtk::init`. The `--no-default-features` job is
  # kept for the one thing this job can't prove: vimcode still builds on a
  # machine without GTK dev libs.
  test-gui:
    name: Test (Linux, headless, GUI feature on)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    # #691: quadraui fetched by Cargo itself, same as the TUI job — see the
    # comment there.

    - name: Install GTK4 dev libraries
      run: |
        sudo apt-get update
        # #720: librsvg2-common ships the gdk-pixbuf SVG loader. It's only a
        # `Recommends` of libgtk-4-1 on Ubuntu, not a hard `Depends`, so
        # --no-install-recommends (below) does NOT pull it in on its own --
        # it must be listed explicitly. Without it, `Pixbuf::from_read` on
        # the app-icon SVG (src/gtk/util.rs) fails, and the two #720 icon
        # tests (src/gtk/testing.rs, src/gtk/util.rs) hard-fail rather than
        # exercising real rasterised pixels.
        #
        sudo apt-get install -y --no-install-recommends libgtk-4-dev librsvg2-common

    # #795/#865: neovim is the oracle for tests/nvim_conformance.rs, a default
    # integration test this (default-features) lane also compiles and runs. It
    # hard-fails on every lane if nvim is missing or below its declared
    # `MIN_NVIM_VERSION`, so this install is load-bearing. It is a pinned
    # upstream tarball rather than `apt-get install neovim` because
    # ubuntu-24.04 apt ships 0.9.5, below the floor — and because CI and the
    # agent fleet must judge Vim behaviour with the same binary.
    - name: Install Neovim ${{ env.NVIM_ORACLE_VERSION }} (oracle for tests/nvim_conformance.rs)
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/nvim.tar.gz \
          "https://github.com/neovim/neovim/releases/download/${NVIM_ORACLE_VERSION}/nvim-linux-x86_64.tar.gz"
        sudo tar -C /opt -xzf /tmp/nvim.tar.gz
        echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

    - name: Verify the conformance oracle
      run: nvim --version | head -1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        # Distinct key from the TUI job — the target dirs diverge (GTK crates).
        key: ${{ runner.os }}-cargo-build-target-gui-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests (GUI feature on, no DISPLAY)
      run: |
        # Guard the lane's whole point: this must be a headless run.
        test -z "${DISPLAY:-}" && test -z "${WAYLAND_DISPLAY:-}"
        cargo test

  # #1042: the two jobs above are both Linux, so `src/macos/mod.rs` — gated
  # `#[cfg(all(feature = "macos", target_os = "macos"))]` in src/lib.rs, and
  # likewise in quadraui itself — is never compiled by either of them and its
  # `mac_driver_tests` (18 `#[test]`s) never run anywhere. This job is a real
  # `macos-latest` runner, not a cross-target `cargo check`: that route was
  # tried and abandoned in #859 (see src/macos/mod.rs's own module doc,
  # "Verifying this file without a Mac") because vimcode depends on
  # tree-sitter, whose build.rs compiles `lib.c` for the *target* — `cc-rs`
  # dies on `-arch` long before rustc would ever see this file.
  #
  # Scoped to `--lib` deliberately: tests/nvim_conformance.rs is a default
  # integration test that hard-fails (not skips) when `nvim` is missing, and
  # this job installs no oracle. `--lib` compiles and runs only the crate's
  # unit tests — which is where `mac_driver_tests` lives — without pulling in
  # the integration targets that need it.
  test-macos:
    name: Test (macOS native, AppKit)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    # #691: quadraui fetched by Cargo itself, same as the Linux jobs — see
    # the comment on the `test` job above.

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        # Distinct key from the Linux jobs — the target dirs diverge (macOS
        # toolchain, AppKit/Core Graphics/Core Text deps).
        key: ${{ runner.os }}-cargo-build-target-macos-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --no-default-features --features macos -- -D warnings

    - name: Run tests
      run: |
        # `cargo test --lib --no-default-features --features macos` (issue
        # #1042's own minimum) runs the *whole* portable lib suite, not just
        # `mac_driver_tests` — on Linux with the equivalent
        # `--no-default-features` flags it's ~2,845 tests. That means a bare
        # "did the overall run report zero tests" check would NOT catch the
        # #645 vacuous-green trap this job exists to close: if some cfg
        # mismatch silently dropped `src/macos/mod.rs::mac_driver_tests`
        # (double-gated on `feature = "macos"` AND `target_os = "macos"`)
        # while the shared portable suite still ran fine, the overall count
        # would stay in the thousands and the job would report green having
        # exercised zero macOS-specific code — exactly the failure mode this
        # issue is about. So: run the full command as specified, but assert
        # specifically on how many `macos::mac_driver_tests::*` cases ran.
        set -euo pipefail
        cargo test --lib --no-default-features --features macos 2>&1 | tee /tmp/macos-test-output.txt
        TOTAL_LINE=$(grep -E '^test result: ' /tmp/macos-test-output.txt | tail -1)
        echo "Overall lib suite: $TOTAL_LINE"
        MAC_PASSED=$(grep -cE '^test macos::mac_driver_tests::.* \.\.\. ok$' /tmp/macos-test-output.txt || true)
        echo "macos::mac_driver_tests cases passed: $MAC_PASSED"
        if [ -z "$MAC_PASSED" ] || [ "$MAC_PASSED" -eq 0 ]; then
          echo "::error::macos::mac_driver_tests ran zero tests — src/macos/ may have compiled but its own suite never executed. This is the #645 vacuous-green trap, not a pass."
          exit 1
        fi

  # The release ships `vcd-windows-x86_64.exe` (release.yml's `build-windows`
  # job), but no other job compiles for Windows at all — without this, the
  # first Windows build a change ever saw was the release run itself, after
  # the Linux release had already been published. Mostly build-only (the
  # same command release.yml uses, so a red build here means a red release)
  # plus one scoped `cargo test` for `tests/conpty_idle_flicker.rs` (#1634)
  # — not a full `cargo test`, which this job still deliberately never runs
  # (that would turn a fast build-verification job into a full Windows test
  # run; the Linux jobs below already cover the shared test suite). Without
  # that step, `conpty_idle_flicker.rs`'s `#[cfg(windows)]`-gated tests
  # would never execute anywhere in CI — the file compiles to zero tests on
  # every Linux job — and could bit-rot silently forever. The same rule
  # applies to every other `#[cfg(windows)]`-gated real-ConPTY test added
  # since: each one needs its own explicitly named step below, or it is
  # dead code in every lane (#1829 review round 1 — a file was added
  # without one, and it ran nowhere until this comment's fix).
  build-windows-tui:
    name: Build (Windows TUI, vcd.exe)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-windows-${{ hashFiles('**/Cargo.lock') }}

    - name: Build vcd.exe (release, no GTK)
      run: cargo build --release --bin vcd --no-default-features

    - name: Smoke --version
      run: target\release\vcd.exe --version

    # #1441: v0.13.0 shipped a vcd.exe that dynamically imports
    # VCRUNTIME140.dll (+ the api-ms-win-crt-* UCRT forwarders) and dies
    # before main() -- with zero output -- on any Windows host missing the
    # VC++ redistributable. `windows-latest` ships that redist, so the
    # `--version` smoke above passed against the *exact* binary that was
    # broken everywhere else. `.cargo/config.toml` sets `+crt-static` to fix
    # it; this step is the regression gate that would have caught it: assert
    # the built exe has no VCRUNTIME140.dll import, rather than trusting that
    # it merely ran on a runner that happens to have the DLL.
    - name: Assert vcd.exe is statically linked (no VCRUNTIME140.dll import)
      shell: pwsh
      run: |
        $bytes = [System.IO.File]::ReadAllBytes("target\release\vcd.exe")
        $text = [System.Text.Encoding]::ASCII.GetString($bytes)
        if ($text -match "VCRUNTIME140\.dll") {
          Write-Host "::error::vcd.exe imports VCRUNTIME140.dll -- +crt-static is not taking effect (check .cargo/config.toml). This is the #1441 regression: the binary will silently fail to start on any Windows host without the VC++ redistributable."
          exit 1
        }
        Write-Host "OK: vcd.exe has no VCRUNTIME140.dll import (statically linked CRT)."

    # #1634: the raw-output ConPTY idle regression test — spawns the
    # `vcd.exe` just built under a real Win32 pseudo console (`portable_pty`,
    # a `[target.'cfg(windows)'.dev-dependencies]` entry) and asserts the
    # byte stream goes silent after settle. Scoped to this one integration
    # test (`--test conpty_idle_flicker`), not a full `cargo test`, per this
    # job's header comment. `windows-latest` hosts a real ConPTY natively, so
    # this runs the same way it does on `dell64` — no emulation involved.
    - name: Run tests/conpty_idle_flicker.rs (#1634, real ConPTY on windows-latest)
      run: cargo test --release --test conpty_idle_flicker --no-default-features

    # #1636: the real-ConPTY activity-bar click regression test — sends real
    # SGR mouse-click bytes into the `vcd.exe` just built and asserts each
    # activity-bar icon actually switches panels, over the same real Win32
    # pseudo console as the #1634 step above. Scoped to this one integration
    # test, per this job's own header comment. A hard (non-`continue-on-
    # error`) gate: RED/GREEN-verified by hand on real `dell64` Windows
    # hardware (three consecutive green runs) before landing — see the
    # file's own module doc for the full investigation — so, unlike a test
    # that was only ever cross-compiled and never actually executed, a red
    # result here is a real signal worth blocking on.
    - name: Run tests/conpty_activity_bar_click.rs (#1636, real ConPTY on windows-latest)
      run: cargo test --release --test conpty_activity_bar_click --no-default-features

    # #1829: real-ConPTY regression test for "Windows TUI: `:term` opens a
    # blank panel with no PowerShell prompt" — same real Win32 pseudo
    # console as the two steps above, typing `:term` + Enter then the
    # issue's own acceptance probe (`echo <marker> > '<path>'` + Enter) and
    # polling the filesystem for the marker. This used to be `continue-on-
    # error: true`: the investigation that added this test (see
    # `PROJECT_STATE.md`/`docs/PENDING_QUADRAUI_ISSUES.md`) isolated the
    # root cause to quadraui's own untested Windows ConPTY leg, so it was
    # *expected* to run RED until that upstream fix landed. #1843 bumps the
    # quadraui pin past quadraui#1327 (the ConPTY VT handshake + shell-gate
    # fix) and promotes this to a hard gate: the upstream fix has landed and
    # this repo's pin has bumped past it, and the step has been observed
    # RED against the prior pin then GREEN against the new one (1.9s), both
    # on real `dell64` Windows hardware — but that is **one** green run, not
    # the three consecutive green runs #1636's own step comment above
    # required before promoting that step to a hard gate. This test's
    # 20s `SETTLE_TIMEOUT` over a cold real PowerShell startup is exactly
    # the profile that can go intermittently red; if this step flakes,
    # gather repeat green runs (including from CI itself) before assuming a
    # real regression, and consider matching #1636's three-run bar by hand
    # on `dell64` if it keeps flaking.
    - name: Run tests/conpty_term_opens_shell_1829.rs (#1829, real ConPTY on windows-latest)
      run: cargo test --release --test conpty_term_opens_shell_1829 --no-default-features

  # #1554: no job before this one ever compiled the Windows *GUI* build
  # (`--features win --bin vimcode`), so a whole class of loader failures
  # (this one included) shipped unnoticed until a real Windows host tried to
  # launch it. `build-windows-tui` above only builds `vcd.exe` with the GTK
  # feature off entirely, which never links quadraui's `win` backend and so
  # never links `TaskDialogIndirect`.
  #
  # `cargo build`/`clippy` alone are not enough here: the missing-manifest
  # bug is a *loader* failure (`STATUS_ENTRYPOINT_NOT_FOUND`,
  # `0xC0000139`), which only reproduces when a real Windows loader actually
  # tries to resolve `vimcode.exe`'s static imports -- something neither
  # `cargo build` nor a Linux/WSL `cargo xwin build` can exercise. Hence the
  # explicit launch step below, asserting on exit code (a loader kill prints
  # nothing to stdout/stderr) rather than on captured output.
  build-windows-gui:
    name: Build (Windows GUI, vimcode.exe)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        components: clippy, rustfmt

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-windows-gui-${{ hashFiles('**/Cargo.lock') }}

    - name: Build vimcode.exe (release, win backend)
      run: cargo build --release --no-default-features --features win --bin vimcode

    # The actual regression test: launch the built exe and require exit code
    # 0. A binary that the loader kills before `main` runs exits
    # `0xC0000139` (`STATUS_ENTRYPOINT_NOT_FOUND`) with zero stdout/stderr --
    # so assert on the process exit code, not on captured output, or a
    # silent loader kill would read as an empty-but-passing smoke.
    - name: Launch vimcode.exe --version (loader smoke)
      shell: pwsh
      run: |
        $proc = Start-Process -FilePath "target\release\vimcode.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
        Write-Host "Exit code: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0) {
          Write-Host "::error::vimcode.exe exited with code $($proc.ExitCode) (0x$($proc.ExitCode.ToString('X'))) -- if this is 0xC0000139 (STATUS_ENTRYPOINT_NOT_FOUND), the Common-Controls v6 manifest is missing again (#1554)."
          exit 1
        }
        Write-Host "OK: vimcode.exe launched and exited 0."

    # Mirrors the #1441 VCRUNTIME140.dll byte check on build-windows-tui:
    # assert the fix is actually present in the binary, not just that this
    # particular runner happened to already have the v6 assembly available
    # (every `windows-latest` runner does, by virtue of the OS itself, so the
    # launch smoke above can't distinguish "manifest embedded" from "loader
    # got lucky" on its own).
    - name: Assert vimcode.exe embeds the Common-Controls v6 manifest
      shell: pwsh
      run: |
        $bytes = [System.IO.File]::ReadAllBytes("target\release\vimcode.exe")
        $text = [System.Text.Encoding]::ASCII.GetString($bytes)
        if ($text -notmatch "Microsoft\.Windows\.Common-Controls") {
          Write-Host "::error::vimcode.exe has no embedded Microsoft.Windows.Common-Controls manifest dependency -- build.rs's /MANIFEST:EMBED linker args are not taking effect (#1554)."
          exit 1
        }
        Write-Host "OK: vimcode.exe embeds the Common-Controls v6 manifest dependency."
