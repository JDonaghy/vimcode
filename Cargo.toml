[package]
name = "vimcode"
version = "0.10.0"
edition = "2021"
description = "Vim-like code editor with GTK4 and tree-sitter"
license = "MIT"

[package.metadata.deb]
maintainer = "VimCode contributors"
copyright = "2024-2026, VimCode contributors"
extended-description = "VimCode is a Vim-inspired code editor built with GTK4, featuring tree-sitter syntax highlighting, LSP support, and a built-in terminal."
# GTK4 runtime libs — apt will install these if missing when the user runs `sudo apt -f install`
depends = "libgtk-4-1 (>= 4.10), libglib2.0-0 (>= 2.68), libpango-1.0-0, libcairo2, libgdk-pixbuf-2.0-0, libgraphene-1.0-0"
section = "editors"
priority = "optional"
assets = [
  ["target/release/vimcode", "usr/bin/vimcode", "755"],
  ["data/io.github.jdonaghy.VimCode.desktop", "usr/share/applications/io.github.jdonaghy.VimCode.desktop", "644"],
  ["data/icons/io.github.jdonaghy.VimCode.svg", "usr/share/icons/hicolor/scalable/apps/io.github.jdonaghy.VimCode.svg", "644"],
]

[lib]
name = "vimcode_core"
path = "src/lib.rs"

[[bin]]
name = "vimcode"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "vcd"
path = "src/tui_bin.rs"

[features]
default = ["gui"]
# `quadraui/gtk` enables the public `quadraui::gtk::draw_*` rasterisers
# (#223). vimcode adopts them one primitive at a time inside
# `src/gtk/quadraui_gtk.rs`.
gui = ["gtk4", "pangocairo", "gio", "quadraui/gtk"]

[dependencies]
# `quadraui/tui` enables the public `quadraui::tui::draw_*` rasterisers
# (#223). vimcode's TUI binary always builds, so the feature is on by
# default in the dependency line; the GTK feature ships gated behind
# vimcode's own `gui` feature above.
# Quadraui lives in its own repo since Session 346 extraction (see PLAN.md).
# Path-dep to a sibling checkout: clone https://github.com/JDonaghy/quadraui
# next to vimcode (i.e. `~/src/quadraui` and `~/src/vimcode` as siblings).
# CI must clone quadraui as a sibling before any cargo step, because
# actions/checkout cannot write outside the workspace — see the
# "Check out quadraui" step in `.github/workflows/ci.yml`. Note this pins
# quadraui's `develop`, so a breaking change there turns vimcode CI red
# without vimcode changing.
quadraui = { path = "../quadraui/quadraui", features = ["tui", "terminal"] }
gtk4 = { version = "0.7", features = ["v4_10"], optional = true }
pangocairo = { version = "0.18", optional = true }
ropey = "1.6.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-language = "0.1"
# tree-sitter-latex: vendored from latex-lsp/tree-sitter-latex v0.3.0 (language version 14)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gio = { version = "0.17", optional = true }
ratatui = "0.30"
ignore = "0.4"
regex = "1"
lsp-types = "0.97"
copypasta-ext = "0.4"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
toml = "0.8"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
streaming-iterator = "0.1.9"
spellbook = "0.4.0"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
insta = "1.39"

[build-dependencies]
cc = "1.0"

# quadraui#452: quadraui's develop tip pulls in vt100 0.16, whose upstream
# manifest exact-pins its own `unicode-width` floor to "^0.2.1" — mutually
# exclusive with `ratatui = "0.29"` above, which upstream-pins
# `unicode-width` to exactly "=0.2.0". quadraui vendored a copy of vt100
# 0.16.2 with only that bound loosened (no source changes) and patches it
# via `[patch.crates-io]` in its OWN Cargo.toml — but Cargo only honors a
# `[patch]` section declared in the root manifest of the workspace actually
# being built, so quadraui's patch has zero effect here; this repo's own
# `[patch.crates-io]` entry (pointing at the same vendored copy, which
# lives at the quadraui monorepo root, a sibling of the `quadraui` crate
# path-dep above) is required too. See
# ../quadraui/vendor/vt100-0.16.2-patched/README-PATCH.md and
# ../quadraui/quadraui/docs/LESSONS.md for the full rationale — do not
# remove this without reading both first.
[patch.crates-io]
vt100 = { path = "../quadraui/vendor/vt100-0.16.2-patched" }

# Optimize dependencies in dev builds — GTK/Relm4/Cairo/Pango FFI calls and
# Tree-sitter parsing are 10-50× slower without optimization, causing visible
# GUI sluggishness during development.  Our own code stays at opt-level 0 for
# fast compilation and good debuginfo.
[profile.dev.package."*"]
opt-level = 2
