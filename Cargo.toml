[package]
name = "vimcode"
version = "0.14.0"
edition = "2021"
description = "Vim-like code editor with GTK4 and tree-sitter"
license = "MIT"

[package.metadata.deb]
maintainer = "VimCode contributors"
copyright = "2024-2026, VimCode contributors"
extended-description = "VimCode is a Vim-inspired code editor built with GTK4, featuring tree-sitter syntax highlighting, LSP support, and a built-in terminal."
# GTK4 runtime libs — apt will install these if missing when the user runs `sudo apt -f install`
depends = "libgtk-4-1 (>= 4.10), libglib2.0-0 (>= 2.68), libpango-1.0-0, libcairo2, libgdk-pixbuf-2.0-0, libgraphene-1.0-0"
section = "editors"
priority = "optional"
assets = [
  ["target/release/vimcode", "usr/bin/vimcode", "755"],
  ["data/io.github.jdonaghy.VimCode.desktop", "usr/share/applications/io.github.jdonaghy.VimCode.desktop", "644"],
  ["data/icons/io.github.jdonaghy.VimCode.svg", "usr/share/icons/hicolor/scalable/apps/io.github.jdonaghy.VimCode.svg", "644"],
]

[lib]
name = "vimcode_core"
path = "src/lib.rs"

# #859: `required-features` used to be `["gui"]`. That list is an **AND**, so
# ANY feature set without `gui` — including `--no-default-features` and
# `--no-default-features --features macos` — made cargo **silently omit this
# whole bin target**: no error, no warning, and none of its tests compiled or
# ran. That is the #645 trap in its purest form, and it was measured, not
# hypothetical: on macmini (2026-09-10) `cargo test --no-default-features`
# exited 0 having built only 2 test binaries, because the app bin was dropped
# on the floor rather than reported as unbuildable.
#
# It is now empty, and `src/main.rs` gates *internally* on which GUI backend
# was compiled in (`cfg(feature = "gui")` / `cfg(all(feature = "macos",
# target_os = "macos"))` / `cfg(all(feature = "win", target_os = "windows"))`
# — #866 added the third arm, no `Cargo.toml` change needed since this stanza
# was already empty), falling back to the terminal UI — loudly, on stderr —
# when none is. Deliberately NOT a `compile_error!`: CI's
# `Test (Linux, headless)` job runs `cargo build/clippy/test
# --no-default-features`, so a hard error there would turn a green lane red
# for a build configuration that is genuinely supported (vimcode-as-TUI, the
# same thing the `vcd` bin is). The omission can no longer be silent because
# the target now builds in *every* feature set — see
# `src/main.rs::gui_backend_tests`. Verified for `win` too (#866): `cargo
# build --no-default-features --features win` produces a real ELF on Linux
# (`GuiBackend::None`, TUI fallback) and, cross-compiled via `cargo xwin
# build --target x86_64-pc-windows-msvc --no-default-features --features
# win`, a real `PE32+ executable ... for MS Windows` (checked with `file`,
# not just a zero exit code).
#
# #645's gui-on invariant is untouched: `default = ["gui"]`, so a plain
# `cargo build` / `cargo test` still compiles the GTK backend exactly as
# before.
[[bin]]
name = "vimcode"
path = "src/main.rs"

[[bin]]
name = "vcd"
path = "src/tui_bin.rs"

# #1461: the ACP contract-test corpus's replay agent — plays the "agent"
# side of a transcript recorded by `AcpClient::spawn_with_recording`
# (`src/core/acp.rs`) back at a real `AcpClient`, so a contract test drives
# the engine's actual NDJSON parsing + dispatch path against realistic wire
# shapes instead of only calling engine functions directly. A `[[bin]]`
# (not a `tests/fixtures/*.sh` script, unlike `fake_acp_agent.sh`) because
# faithfully rewriting a client-request `id` to match what the live client
# actually sent — the one bit of real JSON logic replay needs, see its own
# module doc — is impractical in the jq/python/node-free `/bin/sh` this
# repo otherwise insists on for ACP fixtures; `serde_json` is already an
# unconditional dependency, so this costs nothing new in the graph.
# Located via `env!("CARGO_BIN_EXE_acp-replay-agent")` from
# `tests/acp_contract.rs`, same mechanism `tests/nvim_conformance.rs` etc.
# use for `env!("CARGO_BIN_EXE_vimcode")`.
[[bin]]
name = "acp-replay-agent"
path = "tests/fixtures/replay_acp_agent.rs"

# #657: `tests/acceptance.rs` — the sealed oracle-loop suite root — is entirely
# `#![cfg(all(feature = "test-support", feature = "gui"))]`. Without this
# stanza a driver invocation that forgot the flags would compile the target
# down to zero tests and report a vacuous "0 passed" success. Pinning
# `required-features` turns that into a loud failure instead: with the features
# missing, `cargo test --test acceptance` errors out naming them, and a plain
# `cargo test --no-default-features` simply skips the target rather than
# pretending the GTK half of the suite ran on a machine with no GTK.
#
# The configured driver command (coord-settings, `kind: tui-tuidriver`) is:
#   RUSTC_BOOTSTRAP=1 cargo test --test acceptance --features test-support \
#     -- -Z unstable-options --format json
# `gui` comes along via `default`; `RUSTC_BOOTSTRAP=1` is what makes
# `--format json` accepted by a stable rustc.
[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["test-support", "gui"]

# #1106 review: `tests/gtk_no_display.rs` spawns the compiled `vimcode` binary
# and asserts on the "no display found" message that `src/gtk/mod.rs` prints
# before `gtk4::init()`. That codepath only exists when the binary was built
# with the `gui` feature — under `--no-default-features`, `launch_gui` falls
# straight through to the TUI (see the #859 comment above), so the same
# no-DISPLAY invocation instead starts the TUI against a piped, immediately-
# EOF stdin, which is not what this test is exercising and can fail or hang
# unpredictably in that lane. Pinning `required-features = ["gui"]` makes
# `cargo test --no-default-features` skip this target instead of running it
# against the wrong backend (the same trap `tests/acceptance.rs` above and
# `tests/cli_help.rs`'s `--help` sidestep were written to avoid).
[[test]]
name = "gtk_no_display"
path = "tests/gtk_no_display.rs"
required-features = ["gui"]

[features]
default = ["gui"]

# #657: exposes the in-crate black-box harnesses to an *external*
# integration-test crate — `gtk::testing::{Harness, harness}` and
# `tui_main::testing::TuiShellApp` — so `tests/acceptance.rs` can drive both
# backends the way the in-crate `#[cfg(test)]` suites do. Off for a normal
# `cargo build` / `cargo test`; enable with `cargo test --features
# test-support`. Everything it unlocks is already compiled under `cfg(test)`,
# so this feature adds no new code, only reach.
test-support = []
# `quadraui/gtk` enables the public `quadraui::gtk::draw_*` rasterisers
# (#223). vimcode adopts them one primitive at a time inside
# `src/gtk/quadraui_gtk.rs`.
gui = ["gtk4", "pangocairo", "gio", "quadraui/gtk"]

# #859 (stage 2 of #47): the native macOS backend.
#
# Enables `quadraui/macos` — AppKit + Core Graphics + Core Text rasterisers
# plus `quadraui::macos::shell_runner::run_with_shell`, the AppKit sibling of
# the GTK/TUI shell runners. quadraui gates its own module
# `#[cfg(all(feature = "macos", target_os = "macos"))]`, so on a non-macOS
# host this feature compiles NONE of `quadraui/src/macos/` — enabling it on
# Linux is resolvable and harmless (it pulls no Linux-side code at all), which
# is exactly what makes it usable as the "does the bin still build without
# `gui`?" probe in `src/main.rs`'s tests.
#
# Deliberately does NOT imply `gui`: the whole point is a macOS binary with no
# GTK4 anywhere in the dependency graph (macmini carries no Homebrew/gtk4/
# pkg-config by policy).
#
# The vimcode-side wrapper this gates is `src/macos/mod.rs` — ~30 lines of
# runner wiring with no layout, hit-test, paint or dispatch decision in it.
# It wraps `crate::app::App` directly: #861/#862 type-erased `App`'s last
# GTK-only seams (the `TextMetricsBackend` context setter and the three
# platform-resource fields), so `App` is no longer `#[cfg(feature = "gui")]`
# and the macOS runner drives the same `impl quadraui::ShellApp for App` the
# GTK runner does — see that file's module doc and `src/app.rs`'s.
macos = ["quadraui/macos"]

# #866 (stage 3 of #47, the Win-GUI twin of #859): the native Windows GUI
# backend.
#
# Enables `quadraui/win` — Direct2D + DirectWrite rasterisers plus
# `quadraui::win::shell_runner::run_with_shell`, the Win32 sibling of the
# GTK/macOS/TUI shell runners. Unlike `macos` above, quadraui does **not**
# gate its own `win` module on `target_os = "windows"` (see that module's own
# doc comment): every real WinAPI call inside it is individually
# `cfg(target_os = "windows")`-gated, falling back to a `todo!()` stub
# everywhere else, specifically so `cargo check --features win` type-checks
# on an ordinary Linux host. `win` here inherits that same un-target-gated
# posture — enabling it on Linux is resolvable and compiles the vimcode-side
# wrapper (`src/win/mod.rs`), proving it well-typed without needing a
# Windows host, exactly the "does the bin still build without `gui`?" probe
# `macos` already serves in `src/main.rs`'s tests. Producing (and running) a
# real PE32+ binary additionally needs `cargo xwin build --target
# x86_64-pc-windows-msvc` plus a Windows C cross-toolchain (`clang-cl` +
# `lld-link` + the Windows SDK, via `cargo-xwin`) — `mlua`'s `vendored`
# feature below compiles Lua's C sources for whatever the *target* is, so
# that toolchain is the actual reason this needs pinning to a
# `windows`-capability host, not anything Rust-side.
#
# Deliberately does NOT imply `gui`: the whole point is a Windows binary with
# no GTK4 anywhere in its dependency graph.
#
# The vimcode-side wrapper this gates is `src/win/mod.rs` + `src/win/backend.rs`
# — together comparable in size to their macOS twins. It wraps
# `crate::app::App` directly, the same way `src/macos/mod.rs` does; see that
# file's module doc and `src/app.rs`'s for why `App` needs no `gui` gate to
# support this.
win = ["quadraui/win"]

[dependencies]
# `quadraui/tui` enables the public `quadraui::tui::draw_*` rasterisers
# (#223). vimcode's TUI binary always builds, so the feature is on by
# default in the dependency line; the GTK feature ships gated behind
# vimcode's own `gui` feature above.
# Quadraui lives in its own repo since Session 346 extraction (see PLAN.md).
#
# #691: pinned to a quadraui git rev (was a relative path to a sibling
# checkout, which built against whatever happened to be checked out in
# `~/src/quadraui` — a directory shared by every concurrently-running agent
# on this machine, so one agent's checkout was another agent's broken build;
# see `quadraui-pin.txt`'s history and #625 / #638 / #659 for the incidents
# this caused). Bumping the rev is now a deliberate, reviewable commit —
# edit `rev` below and re-run `cargo test`; `cargo update -p quadraui` alone
# will NOT move a rev-pinned git dep. To build against a local quadraui
# checkout during co-development, copy
# `cargo-config-local-quadraui.toml.example` to `.cargo/config.toml` (see
# that file and CLAUDE.md's "Wrong quadraui checkout" section) — this
# replaces the old `VIMCODE_QUADRAUI_UNPINNED=1` escape hatch, which could
# not build backwards drift (a checkout older than a rev vimcode requires).
#
# #1498 bumped this to pick up quadraui#1091 (`GtkPlatformServices` themes
# `gtk4::FileDialog`'s fallback widgets — sidebar/scrollbar/popover — from
# `Theme` on every `Backend::set_theme` call), which lets this crate delete
# its own `css.rs`/`gtk/css.rs` copy of the same stylesheet instead of
# maintaining a duplicate.
#
# #1576 bumped this to pick up three light-theme fixes: quadraui#1179 (the
# macOS clear colour comes from the theme instead of a hard-coded #1F1F24,
# and the GTK/macOS status bar fills its whole `rect.height` instead of
# stopping at `current_line_height` — fixes the dark band behind the
# traffic lights, the dark gap under the breadcrumbs and the dark Settings
# scrollbar gutter), quadraui#1180 (`AppShell::render` sources the sidebar
# header and resize divider from `Backend::theme()` — a new trait method
# that reads back whatever the host last passed to `set_theme` — instead
# of hard-coded VS-Code-dark literals, and `Form`'s focused row pairs
# `header_fg` with `selected_bg` for guaranteed contrast instead of
# `foreground`, which under `vscode-light` was near-black on near-black),
# and quadraui#1184 (`Theme::default()` stays dark on purpose, but a new
# `Theme::light_default()` gives light-theme builders a palette to spread
# `..` over instead of leaking dark defaults into unmapped fields, and the
# GTK terminal background now comes from the theme). No `quadraui::Theme`
# field was added by any of the three — `to_quadraui_theme_chrome` below
# already mapped `header_bg`/`header_fg`/`separator` before this bump, and
# vimcode's exhaustive literal (not a `..Theme::default()` spread) means
# `light_default()` doesn't apply here either; nothing to change on the
# mapping side. Also carries whatever else had landed on quadraui
# `develop` by then: #1177 (macOS full-screen/traffic-light fix) and
# #1181–#1183 (TUI minimap slider, Toast layout, TUI Tree badge overlap).
#
# #1577 bumped this to pick up quadraui#1185 (VS Code-style actionable
# toasts): `ToastOverlay`/`Toast`/`ToastButton` replace the single-action
# `ToastStack`/`ToastItem`/`ToastAction` (now `#[deprecated]`, kept only so
# a stale caller still compiles — vimcode migrates onto the new shapes in
# this same bump, see `render::build_toast_stack`), each toast carries an
# ordered `actions: Vec<ToastButton>` (one may be `primary`) drawn on its
# own row at the bottom-right (never over the title), and
# `compose::ToastStackController` gives a non-modal toast stack
# Tab/Shift+Tab/Left/Right/Up/Down/Enter/Escape keyboard focus with a
# theme.link_fg focus ring. `Backend::draw_toast_overlay` is the new paint
# entry point; `draw_toast_stack` survives as a deprecated, defaulted
# shim that converts and forwards. Queued after #1576 so the two pin
# bumps don't collide in this file.
#
# #1614 investigated bumping to `928f2b5` (quadraui `develop` HEAD at the
# time) to pick up three Win-GUI fixes — quadraui#1197 (block cursor no
# longer hides the glyph, `win::editor::draw_editor`'s `CursorShape::Block`
# arm now re-paints it in `theme.background`, closing vimcode#1559),
# quadraui#1200 (`WinBackend::install_menu_bar` attaches a real `HMENU` via
# `SetMenu` and declares `native_menu: true`, closing vimcode#1582), and
# quadraui#1199 (`WinBackend` declares `window_chrome: true` and `win::run`
# handles `WM_NCCALCSIZE`/`WM_NCHITTEST`, closing vimcode#1562's title-bar
# item) — but did **NOT** land the bump: real-hardware verification on
# dell64 found `928f2b5` crashes `vimcode.exe` on every startup, before any
# window is shown, with `thread 'main' panicked at quadraui/src/win/run.rs:
# 1712:42: RefCell already borrowed`, aborting (a panic inside a
# non-unwinding Win32 callback). Root cause: `WinBackend::
# install_menu_bar_now`'s `SetMenu` call (new in quadraui#1200) triggers a
# synchronous nested `WM_SIZE` through `SendMessageW`/`CallWindowProcW`
# while `win::run`'s outer call already holds `ws.state.borrow_mut()` —
# `wndproc`'s existing `pump_depth.is_pumping()` re-entrancy guard (#702)
# does not cover this path, since it fires during window creation, before
# the main message pump starts. Filed as JDonaghy/quadraui#1213.
#
# #1618 (refile of #1614) bumps to `6e14d8a` (quadraui `develop` HEAD),
# which contains the fix for #1213 on top of the three Win-GUI fixes above:
# `ce1c763` arms a `ModalPumpGuard` around `install_menu_bar_now`'s `SetMenu`
# call so the nested `WM_SIZE` it triggers bounces off wndproc's existing
# `pump_depth.is_pumping()` re-entrancy guard instead of re-entering the
# already-borrowed `ws.state`, and `6e14d8a` adds a live wndproc regression
# test for it. No further vimcode-side change was needed to pick any of
# #1197/#1199/#1200 up — `App::setup`'s `native_menu` arm and
# `App::render_content`'s `backend_caps()` three-way branch (both already
# in `src/app.rs`, unrelated to this bump) already handle whatever
# `WinBackend::backend_caps()` reports, and picked these three flags up for
# free purely from the pin moving.
#
# #1629 bumps to `d292a4c` (quadraui `develop` HEAD) to pick up
# quadraui#1228 (`bc92d47` + its doc-only follow-up `d292a4c`), which
# reverts the `native_menu: true` half of quadraui#1200:
# `WinBackend::backend_caps()` now declares only `window_chrome: true`
# (matching `GtkBackend`), and `install_menu_bar` is back to the trait's
# no-op default on Win-GUI. #1618's #1622 real-hardware follow-up found
# `native_menu: true` and `window_chrome: true` together meant two
# different things per backend (macOS: a true OS-global menu bar with zero
# in-window footprint, so the native caption should stay; Windows: a
# per-window `SetMenu` `HMENU` sitting directly under the caption) and
# `App::setup`'s `if native_menu {…} else if window_chrome {…}` order
# (correct for macOS) silently starved `window_chrome`'s drawn-caption path
# on Windows — filed as the `BackendCaps::native_menu is overloaded` entry
# in `docs/PENDING_QUADRAUI_ISSUES.md` (now struck, see that file). Rather
# than add the asked-for capability split, quadraui#1228 resolved the
# conflict the other way: Win-GUI drops `native_menu` and switches to the
# same drawn-menu-row + `window_chrome`-doubles-as-titlebar shape GTK
# already uses (a native `HMENU` lives in the non-client area, which
# #1199's drawn caption permanently covers, so it was unreachable anyway).
# `App::setup`'s three-way branch needed no vimcode-side change to pick
# this up — a Win backend now falls into the same `window_chrome` arm GTK
# takes, `capture_window_and_apply_csd`'s `!native_menu` gate now lets
# `set_decorated(false)` run on Windows too, and the macOS `native_menu`
# arm is untouched (`MacBackend` still declares it, unaffected by this
# bump). See `src/win/mod.rs`/`src/win/backend.rs` for the doc-comment
# corrections and the `WinDriver` test replacements this bump required.
#
# #1647 bumps to `fc94f21` (quadraui `develop` HEAD, all CI checks green) to
# pick up quadraui#1232: `WinBackend::draw_menu_bar`,
# `draw_status_bar_interactive`, and `draw_command_center` now register a
# `nc_hit_test` zone for each of their own clickable bounds right after
# computing the real layout, mirroring how `AppShell::render` already
# registers one per activity-bar item. Before this, every point in the
# drawn title band (the menu row, vimcode's inline minimize/maximize/close,
# and the command-centre search box) classified `HTCAPTION` in a live app —
# confirmed on dell64 with real `SendInput`/`mouse_event` input, not
# `PostMessage` (which bypasses `WM_NCHITTEST` and is how the bug went
# unseen past #1199's original review) — swallowing the click before the
# widget ever saw a `MouseDown`, even though the pure `nc_hit_test` unit
# tests passed (they hand-registered the exclusion zone directly). No
# vimcode-side change was needed to pick this up: `src/win/` never computed
# its own hit zones, so there was nothing here to delete — the fix lives
# entirely inside `WinBackend`'s own draw_* calls.
#
# Real-input re-verification (fix round, 2026-10-01): built with `cargo xwin
# build --release --target x86_64-pc-windows-msvc --no-default-features
# --features win` under `RUSTFLAGS="-C target-feature=+crt-static"`, ran
# `vimcode.exe --version` (reports `quadraui fc94f2136bf6, win`, confirming
# the resolved rev), then launched the built `.exe` on dell64's own Windows
# 11 host with an *unlocked, active* session (no `LogonUI`, `query session`
# shows `Active`, `GetForegroundWindow()` non-null) and drove it with
# `SetCursorPos` + `mouse_event` (never `PostMessage`, which bypasses
# `WM_NCHITTEST`):
# - `WM_NCHITTEST` at the drawn menu row (File…Help, the command-centre
#   search box) returns `HTCLIENT`; the narrow inter-widget gaps return
#   `HTCAPTION`.
# - A real click on File opens its dropdown (New Tab/Open File…/Quit etc.).
# - A real click on the maximize button flips `IsZoomed` false → true.
# - A real drag from an `HTCAPTION` point in the menu row moves the window
#   by exactly the drag delta (`GetWindowRect` before/after confirms it).
# - A real click on the close button (`HTCLOSE` by `WM_NCHITTEST`) ends the
#   process (`Get-Process` confirms exit).
# Every PID launched for this was stopped only by exact PID after
# confirming its image path was this build's `vimcode.exe`, never by image
# name.
#
# #1652 bumps to `ca7fcc8` (quadraui `develop` HEAD) to pick up quadraui#1108
# (`TextInput`/`Toolbar`/`Editor` each gain a `new(required…)`/`with_*`/
# `Default` constructor trio, plus the off-by-default `strict-descriptors`
# feature that proves a consumer no longer needs an exhaustive struct
# literal) and quadraui#1109 (removes the 54 deprecated items with zero
# consumer uses; leaves deprecated anything either consumer still has a
# live use of). This is the consumer-migration half quadraui#1251's
# eventual `#[non_exhaustive]` cut needs to find already done:
# `sc_commit_message_to_text_input`/`debug_toolbar`/`sc_button_toolbar`/
# `app_support::scrollbar_probe_editor`/`render::to_q_editor` now build
# their `quadraui::TextInput`/`Toolbar`/`Editor` with the new constructors
# instead of an exhaustive literal, and `render.rs`'s `draw_toolbar`/
# `draw_sidebar_panel` call sites and `raw_syntax_spans` field move onto
# `draw_toolbar_interactive`/`draw_sidebar_panel_interactive`/
# `quadraui::MinimapSpan` — the two remaining quadraui-only
# `#[allow(deprecated)]`s #937 originally needed are gone. Verified by
# temporarily adding `"strict-descriptors"` to this dependency's `features`
# (not committed — quadraui#1251 removes the feature once every consumer
# has migrated) and confirming `cargo check --all-targets` stays clean.
# #1732 bumps to `1a87c4e` (quadraui `develop` HEAD; no `v0.1.0` tag exists
# yet, so this is the closest available target) to pick up 39 commits
# including the Win-GUI caption/drag/theme/quit fixes #1675/#1661/#1667 are
# waiting on (quadraui#1259, #1260, #1261, #1278) and the Windows-TUI ConPTY
# blink fix (quadraui#1284), plus the v0.1.0 breaking batch (`817b800`,
# non_exhaustive descriptors + removed deprecated items), `Backend::
# measure_text` (quadraui#1132) and the Style-tokens/unit-contract work
# (quadraui#1133/#1098).
#
# #1765 bumps to `8425673` (quadraui `develop` HEAD, 11 commits ahead of
# `1a87c4e`) for three fixes: quadraui#1282 (`8968808`, `9c9ccd6`,
# `a48cf10` — caches Win-GUI brushes/text formats on the render target
# instead of allocating ~647 brushes/frame) and quadraui#1101 (`7ed870e` —
# makes `PaintSurface` a public trait; reshapes the `Backend` paint seam
# but did not change vimcode behaviour — confirmed by a clean build on all
# three feature sets, no call-site changes needed).
#
# quadraui#1295 (`3ebead9`, `b145a55`, `26ed611`) narrowed but did not
# close vimcode#1735 (dead-pty busy-spin) for a headless, non-ctty `vcd` —
# see `tests/pty_dead_master_exit.rs`'s module doc for the inter-slice-
# window analysis that motivated the real fix below.
#
# #1775 bumps to `a536053` (quadraui `develop` HEAD, 8 commits ahead of
# `8425673`) for quadraui#1301 (`4fda8f7`, `a536053`) — the actual fix for
# the dead-pty busy-spin: `TuiBackend::wait_events` no longer delegates a
# blocking wait straight to crossterm's broken `UnixInternalEventSource::
# try_read`. It now calls this crate's own `poll(2)`-based
# `wait_for_stdin_ready` first, for the caller's real timeout, and only
# ever hands crossterm a guaranteed non-blocking `Duration::ZERO` call
# once readiness with no hangup bit is already confirmed — so a hangup
# arriving *during* what used to be the delegated blocking call is now
# the wakeup itself (`POLLHUP`), not something a periodic re-check has to
# race a call that never returns. This is what finally fixes vimcode#1735
# — see `tests/pty_dead_master_exit.rs`, now un-`#[ignore]`d.
#
# Also carries quadraui#1099 (`c851834`, `44c95f6` — reshapes `Frame`
# into an owned type, closes the 14-primitive `Surface` gap, makes
# `FrameHitMap` serializable; adopted as-is, no vimcode call-site changes
# needed beyond what the compiler required) and quadraui#1103 (`b6fd556`,
# `b5bf8ad` — optional flex/grid layout over Taffy, feature-gated
# upstream and not enabled here).
quadraui = { git = "https://github.com/JDonaghy/quadraui.git", rev = "a5360532e297deecece65103df8ce61f53230bda", features = ["tui", "terminal"] }
# #896: gtk4/pangocairo/gio are ONE version family with quadraui's own
# gtk4-rs dependency, not three independent bumps. `gtk4-sys` carries
# `links = "gtk-4"`, so Cargo permits exactly one `gtk4-sys` in the whole
# dependency graph — and that check is feature-independent (the lockfile
# resolves optional deps too), so a mismatch fails `cargo check
# --no-default-features` *before compiling anything*, not just the `gui`
# lane.  quadraui moved to gtk4 0.11 / pangocairo 0.22 in quadraui#796;
# vimcode has to move in lockstep or no lane resolves at all.  When the
# quadraui pin above moves across another gtk4-rs bump, these three lines
# move with it — and `gio` must stay in the same gtk-rs release family
# (gtk4 0.11 ↔ glib/gio 0.22), because pairing it with an older major
# resolves two incompatible `glib` majors side by side.
gtk4 = { version = "0.11", features = ["v4_10"], optional = true }
pangocairo = { version = "0.22", optional = true }
ropey = "1.6.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-language = "0.1"
# tree-sitter-latex: vendored from latex-lsp/tree-sitter-latex v0.3.0 (language version 14)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Same gtk-rs release family as `gtk4`/`pangocairo` above — see #896.
gio = { version = "0.22", optional = true }
ratatui = "0.30"
ignore = "0.4"
regex = "1"
# `regex` is deliberately backtracking-free (linear-time guarantee) and so
# cannot express `\1`..`\9` backreferences at all — not a missing feature,
# a permanent design constraint of the crate. `fancy-regex` layers a
# backtracking VM on top of it; vim_regex.rs uses it only for the patterns
# that actually contain a backreference (#1004). Already resolved
# transitively via `termwiz`, so this adds no new dependency to the tree.
fancy-regex = "0.11"
lsp-types = "0.97"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
toml = "0.8"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
streaming-iterator = "0.1.9"
spellbook = "0.4.0"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
# #1345: `tool_acquire.rs` — native LSP/DAP tool acquisition (download,
# verify, unpack) with no shell, sudo, `unzip`, or `tar` binary. `sha2` and
# `flate2` were already in the dependency tree transitively (via other
# crates); pinned here as direct deps since `tool_acquire.rs` uses them
# itself. `tar` and `zip` are new — `zip`'s default features pull in every
# supported compression method (bzip2/zstd/lzma); extension archives only
# ever use plain DEFLATE, so this trims to `deflate` only. That avoids a C
# dependency beyond what deflate already needs (bzip2/zstd/lzma each pull
# their own), but doesn't trim `zip`'s dependency tree overall — `zopfli`,
# `arbitrary`/`derive_arbitrary` and `displaydoc` are unconditional deps of
# `zip` 2.x regardless of enabled features (confirmed in `Cargo.lock`).
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# #1464: ACP `image` content blocks are `{"type":"image","mimeType",
# "data":<base64>}` — `base64` is already resolved transitively (via
# `termwiz`, confirmed in `Cargo.lock`), so pinning it as a direct
# dependency for `AcpManualAttachment::content_block` costs nothing new in
# the graph. `png` encodes the `RgbaImage` a clipboard-image paste reads
# off `quadraui::Clipboard::read_image` into the PNG bytes that block's
# `data` carries — also already resolved transitively (via `image`, itself
# a dependency of `arboard`'s clipboard-image support), same reasoning.
base64 = "0.22"
png = "0.18"

[dev-dependencies]
insta = "1.39"
# #1008: msgpack values for the `tests/nvim_conformance.rs` oracle, which
# drives `nvim --embed` over msgpack-RPC with a UI attached (`nvim_ui_attach`)
# instead of the old `nvim --headless -l script.lua`. Deliberately a
# **dev**-dependency: nothing vimcode ships touches msgpack.
#
# `rmpv` (values + reader/writer), not `nvim-rs` (the transport #27 names):
# nvim-rs is an async client that would drag `tokio` into the test graph for a
# suite whose every call is a blocking request/response over one pipe. The
# ~100-line `NvimRpc` in that file speaks the same three-frame msgpack-RPC
# protocol synchronously; #27's fuzzing loop can build on it or swap in
# nvim-rs then without touching anything else.
rmpv = "1.3"
# #1531: a portable "did these bytes decode as a real image" check for the
# macOS/Win-GUI `build_shell_config` app-icon tests — those two backends have
# no bundled pixel-decoder exposed to test code the way GTK's `gdk_pixbuf` is
# (see `src/gtk/mod.rs`'s `shell_config_identity_tests`, which reuses that
# instead). Already resolved transitively at this exact version (`arboard`'s
# `image-data` feature, pulled in by quadraui's GTK/macOS clipboard support,
# already depends on it), so this adds no new crate version to `Cargo.lock` —
# just a direct name for vimcode's own test code to reach it by.
# `default-features = false` + `features = ["png"]`: the app icon asset this
# decodes is always PNG, so vimcode's own declared need stays minimal even
# though `arboard`'s broader feature request is what actually determines the
# unified build (Cargo unions feature flags across the whole dependency
# graph) — narrowing here is correct today and free if `arboard` ever
# narrows its own request first.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# #1729: parses `tests/smoke-spec/catalogue.yaml` (the bugbash behaviour
# catalogue, claude-coordinator#3580) in `tests/smoke_catalogue.rs`'s schema
# test. Dev-only — nothing vimcode ships reads this file; `coord`'s own
# bugbash tooling reads it directly as YAML in a separate (Python) process.
serde_yaml = "0.9"

# #1634: `tests/conpty_idle_flicker.rs` — the raw-output ConPTY idle
# regression test for the Windows TUI fg-colour flicker. Target-gated (not
# plain `[dev-dependencies]`) because this crate is only meaningful as a real
# Win32 ConPTY host, i.e. only when *this test binary itself* is compiled for
# `x86_64-pc-windows-msvc` and executed on real Windows (`dell64`'s WSL2
# interop, or CI's `windows-latest`) — see that file's module doc. Gating
# here, not just `#[cfg(target_os = "windows")]` inside the test file, keeps
# a plain Linux `cargo test` (which never touches this target) from resolving
# or building the crate at all.
#
# Pinned to `0.9.0`, the exact version already resolved in `Cargo.lock` —
# `portable-pty` is already a transitive dependency (quadraui's `terminal`
# feature, vimcode's own embedded terminal panel) whose Windows backend
# (`portable_pty::win::conpty`) already wraps `CreatePseudoConsole` et al.,
# so this adds no new crate version to the graph, just a direct name this
# test can reach it by instead of hand-rolling the same Win32 FFI a second
# time.
[target.'cfg(windows)'.dev-dependencies]
portable-pty = "=0.9.0"
# #1636: `tests/conpty_activity_bar_click.rs` — the real-ConPTY activity-bar
# click regression test. Same target-gating rationale as `portable-pty`
# above (only meaningful as a real Win32 ConPTY host). `vt100` parses the
# raw ANSI byte stream that test captures back into a screen model (cell
# contents + position) so it can locate each activity-bar icon's actual
# rendered column/row and send a real SGR mouse click at that exact spot,
# rather than hand-rolling a second ANSI parser — quadraui's own
# `tui::vt_testing`/`TuiVtDriver` already depends on this exact crate for
# the same reason (see that module's doc). Pinned to `=0.16.2`, the version
# already resolved in `Cargo.lock` via quadraui's `terminal` feature (always
# enabled — see the `quadraui = {...}` dependency line above), so this adds
# no new crate version to the graph.
vt100 = "=0.16.2"

# #1701: `tests/pty_settings_header_delay.rs` — the real-pty regression test
# for the "Settings sidebar header shows the previous panel's name for
# ~0.4-0.9s after the click" bugbash report. Unix twin of the
# `[target.'cfg(windows)'.dev-dependencies]` block above: a real pty (not
# `quadraui::tui::testing::TuiDriver`'s synthetic-event dispatch, which
# can't observe wall-clock repaint timing at all) is the only way to see
# whether the *live* terminal byte stream lags behind the click the way the
# bugbash explorer's timestamped reads did. Same versions, same
# already-resolved-via-quadraui's-`terminal`-feature rationale as above —
# this adds no new crate version to `Cargo.lock`, just a direct name this
# platform's test code can reach them by.
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

[build-dependencies]
cc = "1.0"

# quadraui#452 / #691 used to need a `[patch.crates-io]` vt100 shim here
# (see git history) because vt100 0.16's own manifest exact-pinned
# `unicode-width` to a bound incompatible with `ratatui`'s. quadraui#795
# removed that vendored shim upstream — its own Cargo.toml now documents
# the conflict as resolved — and the rev bumped for #829 (quadraui#775,
# `Theme::from_vscode_json` / `Color::try_from_hex_over`) postdates that
# fix, so the matching patch here is gone too: keeping it pointed at a
# rev whose repo root no longer vendors `vt100-0.16.2-patched/` broke
# `cargo check` outright ("patch location ... does not contain packages
# matching `vt100`").

# Optimize dependencies in dev builds — GTK/Relm4/Cairo/Pango FFI calls and
# Tree-sitter parsing are 10-50× slower without optimization, causing visible
# GUI sluggishness during development.  Our own code stays at opt-level 0 for
# fast compilation and good debuginfo.
[profile.dev.package."*"]
opt-level = 2
