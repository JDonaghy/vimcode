    id: 'vim-gg-and-g-goto-buffer-ends-top'
    text: 'Ln 1'
    ms: 5000
  - type: wait_idle
    id: 'vim-gg-and-g-goto-buffer-ends-top-settle'
    ms: 350
    timeout_ms: 4000
  - type: key
    id: 'vim-G-key'
    key: 'G'
  # vim-gg-and-g-goto-buffer-ends: 'G' reaches the last line (3)
  - type: expect_within
    id: 'vim-gg-and-g-goto-buffer-ends-bottom'
    text: 'Ln 3'
    ms: 5000
  - type: wait_idle
    id: 'vim-gg-and-g-goto-buffer-ends-bottom-settle'
