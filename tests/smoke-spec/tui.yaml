    key: 'a'
  - type: key
    key: 'z'
  - type: key
    id: 'rebuild2-esc0'
    key: 'esc'
  - type: expect_within
    id: 'rebuild2-line0-landed'
    text: 'foo bar baz'
    ms: 5000
  - type: expect_within
    id: 'rebuild2-line0-normal'
    text: 'NORMAL'
    ms: 3000
  # Rewind to the buffer top: the viewport follows the cursor, so
  # after building the last line via 'o' the earlier lines have
  # scrolled out of view -- 'gg' restores Ln 1 before this journey's
  # own motion/edit begins.
  - type: key
    id: 'rebuild2-rewind-gg1'
    key: 'g'
  - type: key
    id: 'rebuild2-rewind-gg2'
    key: 'g'
  - type: key
    id: 'vim-boundaries-l1'
    key: 'l'
  - type: key
    id: 'vim-boundaries-l2'
    key: 'l'
  - type: key
    id: 'vim-boundaries-dollar'
    key: '$'
  # vim-0-and-dollar-line-boundaries: '$' reaches the last column (11)
  - type: expect_within
    id: 'vim-0-and-dollar-line-boundaries-end'
    text: 'Ln 1, Col 11'
    ms: 5000
  - type: wait_idle
    id: 'vim-0-and-dollar-line-boundaries-end-settle'
    ms: 350
    timeout_ms: 4000
  - type: key
    id: 'vim-boundaries-zero'
    key: '0'
  # vim-0-and-dollar-line-boundaries: '0' returns to column 1
  - type: expect_within
    id: 'vim-0-and-dollar-line-boundaries-start'
    text: 'Ln 1, Col 1'
    ms: 5000
  - type: wait_idle
    id: 'vim-0-and-dollar-line-boundaries-start-settle'
    ms: 350
    timeout_ms: 4000
  # vim-w-moves-word-forward setup
  - type: key
    id: 'rebuild3-clear-colon'
    key: ':'
  - type: key
    id: 'rebuild3-clear-pct'
    key: '%'
  - type: key
    id: 'rebuild3-clear-d'
    key: 'd'
  - type: key
    id: 'rebuild3-clear-enter'
    key: 'enter'
  - type: wait_idle
    id: 'rebuild3-clear-settle'
    ms: 300
    timeout_ms: 4000
  - type: key
    id: 'rebuild3-mode0'
    key: 'i'
  - type: key
    key: 'f'
  - type: key
    key: 'o'
  - type: key
    key: 'o'
  - type: key
    key: ' '
  - type: key
    key: 'b'
  - type: key
    key: 'a'
  - type: key
    key: 'r'
  - type: key
    key: ' '
  - type: key
    key: 'b'
  - type: key
    key: 'a'
  - type: key
    key: 'z'
  - type: key
