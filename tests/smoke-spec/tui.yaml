    key: 'x'
  - type: key
    key: ' '
  - type: key
    key: 'f'
  - type: key
    key: 'o'
  - type: key
    key: 'o'
  - type: key
    id: 'rebuild1-esc1'
    key: 'esc'
  - type: expect_within
    id: 'rebuild1-line1-landed'
    text: 'qux quux foo'
    ms: 5000
  - type: expect_within
    id: 'rebuild1-line1-normal'
    text: 'NORMAL'
    ms: 3000
