    id: 'rebuild1-line0-landed'
    text: 'foo bar baz'
    ms: 5000
  - type: expect_within
    id: 'rebuild1-line0-normal'
    text: 'NORMAL'
    ms: 3000
  - type: key
    id: 'rebuild1-mode1'
    key: 'o'
  - type: key
    key: 'q'
  - type: key
    key: 'u'
  - type: key
    key: 'x'
  - type: key
    key: ' '
  - type: key
    key: 'q'
  - type: key
    key: 'u'
  - type: key
    key: 'u'
