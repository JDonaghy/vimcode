  - type: key
    id: 'rebuild1-clear-pct'
    key: '%'
  - type: key
    id: 'rebuild1-clear-d'
    key: 'd'
  - type: key
    id: 'rebuild1-clear-enter'
    key: 'enter'
  - type: wait_idle
    id: 'rebuild1-clear-settle'
    ms: 300
    timeout_ms: 4000
  - type: key
    id: 'rebuild1-mode0'
