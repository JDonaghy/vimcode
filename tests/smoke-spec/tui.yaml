# Tier-2 real-terminal smoke spec for vimcode#1646 (claude-coordinator epic
# #3482, v0.5.551's new real-platform acceptance drivers).
#
# Driver: `tui-pty` (coord/tui_pty_driver.py) — launches the real `vcd`
# binary under a real pty (`UnixPtyChild` on Linux/macOS, ConPTY on
# Windows), sends real terminal byte sequences, and asserts on the resulting
# VT screen. This is the TIER THIS REPO ALREADY HAS DIRECT, RUN-ON-REAL-
# HARDWARE EXPERIENCE WITH: `tests/conpty_idle_flicker.rs` (#1634) and
# `tests/conpty_activity_bar_click.rs` (#1636) exercise the identical idea
# in Rust via `portable_pty` on real Windows ConPTY (dell64). This YAML file
# is the cross-platform, coord-driven analogue of those two files, reusing
# the same layout facts they already derived (see per-step comments below)
# so the Linux/macOS run coord's `tui-pty` driver performs and the Windows
# ConPTY run those Rust tests perform are checking the same thing two ways.
#
# `coord`'s driver supplies the actual `launch_command`/`cwd` (this file
# only names the rendered-screen oracle) — the launch command this spec was
# authored and real-pty-verified against opens vcd on a small, real,
# non-empty text file (a handful of short lines) with LSP disabled and nerd
# fonts off, e.g. `vcd sample.txt` with `HOME` pointed at a settings.json
# carrying `{"lsp_enabled": false, "use_nerd_fonts": false}` — the same
# determinism precondition `tests/conpty_activity_bar_click.rs`'s own
# `isolated_home()` sets up, and for the same reason (nerd-fonts-off makes
# the activity bar paint its single-ASCII-character fallback glyphs, which
# is what pins `ICON_COLUMN`/the per-row markers below to fixed values
# instead of a font-dependent one).
#
# Grid and row/column layout confirmed by a real run of this exact binary
# under a real Linux pty, `cols: 100` x `rows: 30`, HOME pointed at a fresh
# (no stale state) config dir: the activity bar is always the screen's
# leftmost column (`x = 0` accent, `x = 1` icon glyph — exactly
# `tests/conpty_activity_bar_click.rs`'s own `ICON_COLUMN = 1`), and with no
# title/tab-bar row inserted above it, row 0 is the hamburger menu toggle,
# rows 1-7 are Explorer/Search/Debug/Source Control(Git)/Extensions/AI
# Assistant/Board in that fixed order (`src/render.rs`'s `fixed` array,
# `build_activity_bar`), and the last row (here, row 29) is Settings.
#
# #1740 UPDATE: the "Explorer/Search/Debug/Source Control" order claimed two
# paragraphs up is now known stale — `src/core/engine/sidebar.rs`'s
# `FIXED_ACTIVITY_PANEL_IDS` (the single source of truth `build_activity_bar`'s
# `fixed` array now reads from, guarded by a `debug_assert_eq!` against
# drifting back out of sync) was reordered by #1698 to match VS Code's real
# top-to-bottom order — Explorer, Search, Source Control, Debug — putting
# Source Control at row 3 and Debug at row 4, the reverse of this header's
# original claim. That makes the `click-source-control-icon`/
# `activity-bar-source-control-switches-panel-1636` pair below, which clicks
# row 4 expecting "SOURCE CONTROL", land on the Debug panel instead and time
# out. Per #3509's additive-only policy for this file, that pair is left
# byte-for-byte unchanged rather than edited to agree with the corrected
# order — see the new `-1740`-suffixed step pair placed right after it
# below (row 3 for Source Control, row 4 for Debug) for this issue's actual,
# currently-true acceptance coverage, and
# `src/tui_main/app_on_tui_tests.rs`'s
# `activity_bar_row_click_order_matches_fixed_activity_panel_ids` for the
# Tier-1 in-process pin of the same row→panel mapping.
#
# ── vimcode#1835 update (2026-10-09): typing/`:term`/extension-install
#    probes added (see the new `-1835`-suffixed section near the end of
#    this file) ───────────────────────────────────────────────────────────
#
# Real run: `coord app-drive run-spec tui-pty` against a locally-built
# `vcd` (this repo, this branch), isolated HOME
# (`lsp_enabled`/`use_nerd_fonts` off), real `UnixPtyChild` -- PASS, all
# three new steps GREEN. Run from a macOS host (this issue's own worktree
# had no Linux box available), not the literal Linux host this issue
# names -- `tui-pty`'s own module doc is explicit that `UnixPtyChild`
# backs both Linux and macOS identically (no platform-conditional code in
# the driver or in vimcode's own pty-handling path), so this confirms the
# steps work over a real, unmodified pty, but a Linux-hardware run is
# still the literal acceptance bar this issue names and remains
# outstanding -- tracked in PROJECT_STATE.md, not silently treated as
# closing the Linux half of this issue.
name: vimcode-tui-pty
cols: 100
rows: 30
steps:
  - type: launch
    id: launch

  # Precondition, not one of this file's own regression oracles: the first
  # real frame must have painted (status bar's NORMAL mode indicator)
  # before anything below can mean anything. Deliberately `expect_within`
  # (poll for the real content), never `wait_idle` followed by a one-shot
  # `expect_screen`: extension-registry refresh (`Engine::ext_refresh`,
  # spawned unconditionally by the real `vcd` startup path, never by the
  # deterministic `startup_without_session_restore` test entry point) does
  # a real network fetch before the very first frame settles, and a child
  # that has not yet sent *any* bytes trivially satisfies "quiet for 800ms"
  # from the instant it launches — RED-verified by hand against this exact
  # file with the `wait_idle`-then-`expect_screen` shape it used to have:
  # `wait_idle` returned immediately (nothing had arrived yet to be
  # "unquiet"), so `expect_screen` checked a genuinely blank screen and
  # failed, and the *next* step (`expect_silent`) then saw real startup
  # bytes still arriving and failed too — both false negatives from
  # checking before the real paint, not real regressions. Polling for the
  # actual expected text (mirroring
  # `tests/conpty_activity_bar_click.rs`'s own
  # `wait_for_screen_contains`/its module doc's explanation of the
  # identical false-negative shape for a fixed quiet-window) sidesteps the
  # question entirely: it succeeds the moment the real paint lands,
  # however long that takes, up to a generous budget here (mirrors that
  # same Rust test's `SETTLE_TIMEOUT = 15s`).
  - type: expect_within
    id: first-frame-painted
    text: "NORMAL"
    ms: 20000

  # vimcode#1736 — a bugbash report that row 1 of the Explorer sidebar
  # shows "a spurious 'n  N  r  c  …' hint row ... where `▾ + WORK`
  # belongs", pushing the tree down one row. **#1736 is still open and
  # this step is not its fix** (see `src/tui_main/app_on_tui_tests.rs`'s
  # two `*_1736` tests for the full investigation, and for what is still
  # undecided and needs a human product call). What this step pins, at
  # the pty layer and under the report's own conditions — fresh HOME,
  # first settled frame, zero keys or clicks sent, which is why it sits
  # here above every `click`/`key` step rather than at the end of the
  # file — is the one part the investigation did settle: `n  N  r  c  …`
  # is neither corruption nor a race. It is #1693's view-actions toolbar
  # rendering its documented nerd-fonts-off ASCII fallbacks
  # (`icons::EXPLORER_NEW_FILE` `n` / `_NEW_FOLDER` `N` / `_REFRESH` `r`
  # / `_COLLAPSE_ALL` `c` / `_OVERFLOW` `…`), on row 1, which is exactly
  # where the `right-click-explorer-root-row-1703` comment below already
  # documents it belongs.
  #
  # `region:` confines the assertion to the sidebar band (cols 3..22 —
  # the activity bar owns cols 0..2, `x = 0` accent / `x = 1` icon / `x
  # = 2` the `│` divider, and the editor band's content starts at col
  # 25), so it cannot be accidentally satisfied by editor content. It is
  # launch-independent: neither the sidebar's default width nor the
  # toolbar's 3-cell-per-button `" {} "` segments depend on the launch
  # `cwd`/file the way `right-click-explorer-row` below does. Column
  # band and glyph columns (`n` at 9, `N` 12, `r` 15, `c` 18, `…` 21)
  # confirmed by a real `coord.tui_pty_driver` run of this exact file
  # against a real Linux pty at this grid. Falsifiability confirmed the
  # same way: re-running this step with `region.row: 2` fails, so it
  # really is pinned to row 1 and would catch the one-row push-down the
  # report describes. `expect_within` rather than `expect_screen` for
  # the same reason every other check in this file uses it — see the
  # `first-frame-painted` comment above.
  #
  # Only the Explorer half of #1736 is checkable at this tier. The
  # report's other half (the tree being "out of alignment relative to"
  # the editor pane) needs the editor's own row-1/row-2 content, and
  # there is no launch-independent anchor for it here: the breadcrumb
  # bar renders the launch file's own basename, the editor body renders
  # that file's own text, line numbers are off in the default config,
  # and the default theme paints the breadcrumb bar's background
  # identically to the editor's (`bg == '000000'` for both, probed over
  # a real pty). That half is covered at Tier-1 by
  # `explorer_root_row_matches_editor_first_content_row_1736`, where the
  # harness owns the file content. Do not "upgrade" it to a step here by
  # hardcoding `sample.txt`/its text — this file's header deliberately
  # describes the launch command as an example, not a contract.
  - type: expect_within
    id: explorer-toolbar-owns-row-1-1736
    region: {row: 1, col: 3, height: 1, width: 20}
    text: "n  N  r  c  …"
    ms: 5000

  # vimcode#1741 — this control failed ~100% of real-pty runs (2168-2377
  # bytes received during the supposed-silent 3s window below) because it
  # started measuring immediately after `first-frame-painted`/the #1736
  # toolbar check above, with no settle margin for `Engine::ext_refresh`'s
  # background extension-registry network fetch to actually land. That
  # fetch is spawned unconditionally at real `vcd` startup (never by the
  # deterministic Tier-1 harness entry points, which is why no in-process
  # test saw this) and its completion repaint — the same one
  # `tui_main::app_on_tui_tests::idle_stability_1737`'s module doc traces to
  # `Engine::poll_ext_registry` consuming the fetch result on the first
  # `poll_idle` tick after first paint, visible later as the "Extension
  # registry updated (N extensions)" status message — can land anywhere in
  # the first few seconds after first paint, not necessarily before this
  # step would otherwise start. A probe spec (launch -> expect_within
  # NORMAL -> `wait_idle` 2000ms/30000ms budget -> `expect_silent` 3s)
  # passed cleanly, isolating the cause to missing settle time here, not to
  # ongoing churn — i.e. still the #1634 control it always was, just
  # started too early. This `wait_idle` gives the fetch's one legitimate
  # repaint room to happen *before* the silence window opens, rather than
  # inside it.
  - type: wait_idle
    id: settle-ext-registry-fetch-1741
    ms: 2000
    timeout_ms: 30000

  # vimcode#1634 was specifically a Windows-Terminal *rendering* bug — a real
  # ~1Hz foreground flicker with a genuinely silent underlying byte stream
  # (confirmed in `tests/conpty_idle_flicker.rs`'s own module doc: the bug
  # lives in the terminal emulator layer, which a real pty on Linux/macOS
  # cannot reproduce — see `coord/tui_pty_driver.py`'s module doc, "What this
  # tier does NOT see"). This step cannot catch #1634 itself. It guards the
  # backend-neutral precondition #1634 depends on staying true everywhere:
  # an idle `vcd` must emit zero repaint bytes, on every platform, not just
  # the one the bug was filed against. Expected GREEN today — this is the
  # control, not the reproduction.
  - type: expect_silent
    id: idle-truly-silent
    seconds: 3

  # vimcode#1702 and #1737 each independently caught a one-off real-pty
  # failure of the 3s check above: a repeating paired SGR-reset +
  # hide-cursor burst (`\x1b[39m\x1b[49m\x1b[59m\x1b[0m\x1b[?25l`), roughly
  # every ~2s, persisting "10+ seconds straight" in both reports — but
  # neither could reproduce it again across 8-9 follow-up fresh-HOME
  # attempts, and a direct code audit both times (`render::
  # run_shared_tick_chores` and every 2s periodic chore `Engine::poll_idle`
  # runs) found every one of them already gates its redraw on an actual
  # before/after difference, matching the #1650 fix neither has regressed
  # from since. This step cannot force the intermittent failure to
  # reproduce any more reliably than the two bugbash runs that found it
  # did, but it widens this control's own window well past the 3s original
  # (and past the sidebar-open `idle_stability_1650`/#1702 Tier-1 test's
  # 12s) to the "10-15s" duration #1737's own reproduction steps describe,
  # so a *persistent* (not one-off) recurrence has a real chance of being
  # caught here before the next bugbash run finds it on real hardware
  # again. See `tui_main::app_on_tui_tests::idle_stability_1737` for the
  # in-process (Tier-1) sibling of this step, including the one concrete,
  # 100%-reproducible-in-this-PR finding its own investigation turned up:
  # a single, legitimate extra repaint shortly after first paint from
  # `Engine::poll_ext_registry` settling the startup extension-registry
  # fetch — consistent with #1737's own evidence capture's first (lone,
  # unpaired) logged write, but not with the recurring pairs reported
  # afterward.
  - type: expect_silent
    id: idle-truly-silent-extended-1737
    seconds: 13

  # ─────────────────────────────────────────────────────────────────────
  # vimcode#1731 -- priority-1 vim-mode catalogue journeys (tests/smoke-spec/
  # catalogue.yaml), real-pty-verified (3 consecutive clean `coord`
  # tui-pty-driver runs against this exact build/spec, HOME-isolated with
  # `use_nerd_fonts`/`lsp_enabled` off, same precondition as this file's own
  # header). Each journey below clears the buffer (':%d') and types its own
  # known fixture text via `i`/`o` rather than relying on the fixture
  # `sample.txt` (alpha/beta/gamma has no spaces, so word-motion/operator
  # journeys need real multi-word content) -- this also makes every journey
  # independent of the activity-bar/context-menu steps above, so neither
  # section can break the other under the additive-only rule (#3509).
  #
  # Two real-build findings from authoring this batch, not fixed here
  # (filed as their own finding in the PR, not papered over by a weaker
  # assertion that happens to still pass):
  #   - 'gg'/'G' move the cursor's LINE correctly but do not reset its
  #     COLUMN to the line's first non-blank the way real Neovim does --
  #     confirmed directly (move to column 9 via 'w' 'w', then 'gg': lands
  #     at column 11, the line's length, not column 1). The checks below
  #     therefore only assert the line half of each gg/G journey's expected
  #     outcome, not the column half.
  #   - A single key sent in the same instant a multi-key motion
  #     immediately follows a just-passed `expect_within` can still land
  #     before the app's input queue is truly ready for it (silently
  #     typed as a literal character instead of executing as a motion/
  #     command) -- every mode transition and multi-key motion below is
  #     followed by a short `wait_idle` margin for exactly this reason.

  # Settle past the startup transient (extension-registry refresh,
  # initial layout) before the first real buffer interaction below.
  - type: key
    id: 'vim-batch-settle-esc'
    key: 'esc'
  - type: wait_idle
    id: 'vim-batch-settle-wait'
    ms: 500
    timeout_ms: 15000
  # vim-gg-and-g-goto-buffer-ends setup
  - type: key
    id: 'rebuild1-clear-colon'
    key: ':'
  - type: key
    id: 'rebuild1-clear-pct'
    key: '%'
  - type: key
    id: 'rebuild1-clear-d'
    key: 'd'
  - type: key
    id: 'rebuild1-clear-enter'
    key: 'enter'
  - type: wait_idle
    id: 'rebuild1-clear-settle'
    ms: 300
    timeout_ms: 4000
  - type: key
    id: 'rebuild1-mode0'
    key: 'i'
  - type: key
    key: 'f'
  - type: key
    key: 'o'
  - type: key
    key: 'o'
  - type: key
    key: ' '
  - type: key
    key: 'b'
  - type: key
    key: 'a'
  - type: key
    key: 'r'
  - type: key
    key: ' '
  - type: key
    key: 'b'
  - type: key
    key: 'a'
  - type: key
    key: 'z'
  - type: key
    id: 'rebuild1-esc0'
    key: 'esc'
  - type: expect_within
    id: 'rebuild1-line0-landed'
    text: 'foo bar baz'
    ms: 5000
  - type: expect_within
    id: 'rebuild1-line0-normal'
    text: 'NORMAL'
    ms: 3000
  - type: key
    id: 'rebuild1-mode1'
    key: 'o'
  - type: key
    key: 'q'
  - type: key
    key: 'u'
  - type: key
    key: 'x'
  - type: key
    key: ' '
  - type: key
    key: 'q'
  - type: key
    key: 'u'
  - type: key
    key: 'u'
  - type: key
    key: 'x'
  - type: key
    key: ' '
  - type: key
    key: 'f'
  - type: key
    key: 'o'
  - type: key
    key: 'o'
  - type: key
    id: 'rebuild1-esc1'
    key: 'esc'
  - type: expect_within
    id: 'rebuild1-line1-landed'
    text: 'qux quux foo'
    ms: 5000
  - type: expect_within
    id: 'rebuild1-line1-normal'
    text: 'NORMAL'
    ms: 3000
  - type: key
    id: 'rebuild1-mode2'
    key: 'o'
  - type: key
    key: 's'
  - type: key
    key: 'h'
  - type: key
    key: 'o'
  - type: key
    key: 'r'
  - type: key
    key: 't'
  - type: key
    id: 'rebuild1-esc2'
    key: 'esc'
  - type: expect_within
    id: 'rebuild1-line2-landed'
    text: 'short'
    ms: 5000
  - type: expect_within
    id: 'rebuild1-line2-normal'
    text: 'NORMAL'
    ms: 3000
  # Rewind to the buffer top: the viewport follows the cursor, so
  # after building the last line via 'o' the earlier lines have
  # scrolled out of view -- 'gg' restores Ln 1 before this journey's
  # own motion/edit begins.
  - type: key
    id: 'rebuild1-rewind-gg1'
    key: 'g'
  - type: key
    id: 'rebuild1-rewind-gg2'
    key: 'g'
  - type: key
    id: 'vim-gg-1-key'
    key: 'g'
  - type: key
    id: 'vim-gg-1-key2'
    key: 'g'
  # vim-gg-and-g-goto-buffer-ends: 'gg' from the last line reaches line 1
  - type: expect_within
    id: 'vim-gg-and-g-goto-buffer-ends-top'
    text: 'Ln 1'
    ms: 5000
  - type: wait_idle
    id: 'vim-gg-and-g-goto-buffer-ends-top-settle'
    ms: 350
    timeout_ms: 4000
  - type: key
    id: 'vim-G-key'
    key: 'G'
  # vim-gg-and-g-goto-buffer-ends: 'G' reaches the last line (3)
  - type: expect_within
    id: 'vim-gg-and-g-goto-buffer-ends-bottom'
    text: 'Ln 3'
    ms: 5000
  - type: wait_idle
    id: 'vim-gg-and-g-goto-buffer-ends-bottom-settle'
    ms: 350
    timeout_ms: 4000
  # vim-0-and-dollar-line-boundaries setup
  - type: key
    id: 'rebuild2-clear-colon'
    key: ':'
  - type: key
    id: 'rebuild2-clear-pct'
    key: '%'
  - type: key
    id: 'rebuild2-clear-d'
    key: 'd'
  - type: key
    id: 'rebuild2-clear-enter'
    key: 'enter'
  - type: wait_idle
    id: 'rebuild2-clear-settle'
    ms: 300
    timeout_ms: 4000
  - type: key
    id: 'rebuild2-mode0'
    key: 'i'
  - type: key
    key: 'f'
  - type: key
    key: 'o'
  - type: key
    key: 'o'
