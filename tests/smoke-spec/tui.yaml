  # vimcode#1635 ("slow right-click context menus") — a real SGR right-click
  # (button 2) on an Explorer row, confirmed by a real run of this exact
  # binary under a real Linux pty to open the file-tree context menu
  # ("New File...", "New Folder...", ...) in well under a second. `tui-pty`
  # has no dedicated latency-measuring step (unlike `win-native`'s
  # `expect_menu_latency`); `expect_within`'s own `ms` budget stands in as
  # the latency bound here — a menu that needs the full budget to appear is
  # exactly as much a regression as one that never appears at all.
  - type: click
    id: right-click-explorer-row
    row: 3
    col: 10
    button: right
  - type: expect_within
    id: context-menu-opens-within-budget-1635
    text: "New File"
    ms: 1500

  # Dismiss the still-open context menu. No explicit `:qa!` quit sequence
  # follows — `coord/tui_pty_driver.py`'s own teardown (`PtyChild.close()`)
  # terminates the child unconditionally once the spec finishes, the same
  # way `tests/conpty_activity_bar_click.rs`'s own teardown falls back to
  # `child.kill()` after a best-effort `:qa!` write.
  - type: key
    id: dismiss-context-menu
    key: esc

  # vimcode#1703 — an *additional* (not a replacement) right-click check,
  # deliberately added beside `right-click-explorer-row` rather than
  # changing it: #3509 treats this file as additive-only, so a brittle
  # existing step never gets silently rewritten away even when its own
  # coordinate turns out to depend on launch `cwd` contents (see below).
  #
  # A real bugbash run (coord `tui-pty` lane, explorer `e8c1584af040`,
  # 2026-10-03) failed `context-menu-opens-within-budget-1635` because that
  # run's launch `cwd` held only plain files, no subfolder, and `row: 3`
  # landed on one of those files — whose context menu correctly omits
  # "New File.../New Folder..." (folder-only actions). Right-clicking an
  # *actual* folder row in that same run opened the full folder menu
  # ("New File...", "New Folder...", "Open Containing Folder", ..., "Delete")
  # well within budget (<100ms observed) — i.e. this was the existing
  # step's own hardcoded-coordinate coupling to a specific `cwd` layout,
  # not a functional regression in the app. `src/tui_main/app_on_tui_tests.rs`'s
  # `right_click_row_3_on_a_folderless_cwd_hits_a_file_not_a_folder_1703`
  # reproduces and confirms this at the unit level.
  #
  # `row: 2, col: 10` is cwd-layout-independent: `build_explorer_rows`
  # (`src/core/engine/explorer_ops.rs`) pushes the Explorer's root entry
  # unconditionally with `is_dir: true`, before listing any children, so
  # the root entry's row is always a directory regardless of what the
  # launch `cwd` happens to contain. This step is therefore a reliable
  # Tier-2 oracle for #1635 ("slow right-click context menus") that cannot
  # flake the way `right-click-explorer-row` can on an unexpected `cwd`
  # layout.
  #
  # Why row 2 and not row 1 (#1693): the Explorer panel's rows in this grid
  # are 0 = sidebar header ("EXPLORER"), 1 = the view-actions toolbar
  # (New File / New Folder / Refresh / Collapse All / "...") that #1693
  # added above the tree, 2 = the root entry, 3+ = its children. #1703 was
  # authored before #1693 landed and originally aimed at row 1; a row-1
  # right-click now hits the toolbar, which opens no context menu at all.
  # The toolbar is an unconditional single-row
  # `SidebarPanelChrome::StatusBars` (`src/app.rs`), so this is a fixed
  # one-row offset, not a return of the `cwd` coupling above. The unit
  # test named below asserts row 2 really is the root entry, so further
  # header chrome breaks that test rather than silently re-aiming this
  # step; keep the two in sync.
  - type: click
    id: right-click-explorer-root-row-1703
    row: 2
    col: 10
    button: right
  - type: expect_within
    id: context-menu-opens-within-budget-root-row-1703
    text: "New File"
    ms: 1500
  - type: key
    id: dismiss-context-menu-root-row-1703
    key: esc

  # ─────────────────────────────────────────────────────────────────────
  # vimcode#1835 -- Linux "first five minutes" smoke: typing, `:term`, and
  # extension-install probes, exercised with the `type_text`/`expect_file`
  # driver steps `tui-pty` gained for exactly this purpose
  # (claude-coordinator#3650). Additive (#3509): a new section appended
  # after the vim-journey/activity-bar/context-menu coverage above,
  # independent of all of it -- each probe below clears the buffer and/or
  # opens its own terminal pane rather than relying on any prior section's
  # state, so this section can run (or be re-run) standalone.
  #
  # Unlike every `expect_within`/`expect_screen` check elsewhere in this
  # file (which only ever reads the rendered VT *screen*), the three
  # checks below read the real *filesystem* -- the one surface no amount
  # of screen-painting can fake: a save, a `:term` shell command, and an
  # installed extension's manifest must each leave a real file behind, not
  # merely a believable-looking status line.
  #
  # Real-pty run (macOS, `UnixPtyChild` -- the same pty-backed code path
  # `tui-pty` uses on Linux; see this file's own header for why a real
  # pty on either platform exercises the identical vimcode-side code):
  # all three probes below GREEN on first clean run after one authoring
  # correction (see the `w-probe-write-command-1835` comment) --
  # `coord app-drive run-spec tui-pty` against this exact build, isolated
  # HOME, `use_nerd_fonts`/`lsp_enabled` off. A Linux-hardware
  # confirmation (the literal platform this issue names) is still
  # outstanding -- see PROJECT_STATE.md.
  #
  # Review round 1 (self-invalidation fix): a fixed `/tmp`/extensions-dir
  # path with nothing that ever deletes it means every probe below is a
  # one-shot test -- from the second run onward it passes even if `:term`
  # never opens or the shell swallows the typed command, because a PRIOR
  # run's leftover file on disk still satisfies `expect_file`. Three
  # changes fix that: (a) the `:term`/extension-install shell commands now
  # `rm` their own target before (re)creating it, so each run's pass
  # depends on that run's own command actually executing in a live shell,
  # not a stale file from a previous pass; (b) the `w-bare-probe-*-1835`
  # steps right after the `:saveas` probe append a NEW marker suffix and
  # re-save with a bare `:w`, so that check can only pass if `:w` itself
  # just ran -- a leftover file from an earlier run would be missing the
  # suffix and fail `contains`; (c) a trailing cleanup block at the end of
  # this section removes every file/directory this section created, both
  # so the NEXT run starts clean and so this probe stops permanently
  # installing a bogus extension into the operator's real
  # `~/.config/vimcode/extensions/` (which every later `vimcode`/`vcd`
  # launch on the host would otherwise load, forever).
  - type: key
    id: 'w-probe-settle-esc-1835'
    key: 'esc'
  - type: wait_idle
    id: 'w-probe-settle-1835'
    ms: 300
    timeout_ms: 5000

  # 1. Typing -> `:w` -> `expect_file`. A real user gesture (insert text,
  # Escape, save to an explicit path) must actually land the typed text on
  # disk.
  #
  # Authoring finding, not a bug fix, noted rather than papered over
  # (same rigor this file's header already applies to the `gg`/`G`
  # column-reset finding): plain Vim lets `:w {path}` write the current
  # buffer to a NEW path without renaming the buffer; vimcode's `:w`
  # (`"write"`/`"write!"` in `src/core/engine/execute.rs`) matches `cmd`
  # *exactly* against the literal strings `"write"`/`"write!"` -- a
  # trailing path argument makes the whole command fall through to the
  # catch-all arm, so `:w {path}` is not a silent no-op, it is an
  # UNRECOGNIZED command (`"Not an editor command: write {path}"`) that
  # does not even save the CURRENT file -- confirmed by a real run of
  # this exact probe with a bare `:w <path>` in place of `:saveas <path>`
  # below, which left no file at all on disk. `:saveas <path>` is the
  # command vimcode actually implements for "write to this explicit
  # path" (`execute.rs`'s `"saveas" =>`/`strip_prefix("saveas ")` arms),
  # so that's what this probe uses for the new-path half of the check. It
  # is also launch-independent, which a bare `:w` (saving back to
  # whatever file `coord` happened to launch, a path this file's own
  # header deliberately does not pin down) would not be -- the same
  # reason `right-click-explorer-root-row-1703` above switched off a
  # launch-dependent coordinate. The literal bare-`:w` gesture the issue
  # names is still covered, just deferred until AFTER `:saveas` has named
  # the buffer (see the `w-bare-probe-*-1835` steps below) so it stays
  # launch-independent too, re-saving to the SAME now-explicit path.
  #
  # NOT filed as a vimcode bug: no documentation claims `:w {path}` is
  # supported, and fixing engine behavior is out of this smoke-spec-
  # authoring issue's scope -- flagged here, and in PROJECT_STATE.md, for
  # the coordinator to file as a real tracked issue (this worker cannot
  # run `gh`); until that issue number exists there is nothing to put in
  # this comment beyond this description.
  - type: key
    id: 'w-probe-clear-colon-1835'
    key: ':'
  - type: key
    id: 'w-probe-clear-pct-1835'
    key: '%'
  - type: key
    id: 'w-probe-clear-d-1835'
    key: 'd'
  - type: key
    id: 'w-probe-clear-enter-1835'
    key: 'enter'
  - type: wait_idle
    id: 'w-probe-clear-settle-1835'
    ms: 300
    timeout_ms: 4000
  - type: key
    id: 'w-probe-insert-1835'
    key: 'i'
  - type: type_text
    id: 'w-probe-type-text-1835'
    text: 'VIMCODE_SMOKE_SAVE_PROBE_1835'
  - type: key
    id: 'w-probe-esc-1835'
    key: 'esc'
  - type: expect_within
    id: 'w-probe-landed-1835'
    text: 'VIMCODE_SMOKE_SAVE_PROBE_1835'
    ms: 5000
  - type: type_text
    id: 'w-probe-write-command-1835'
    text: ":saveas /tmp/vimcode-smoke-save-probe-1835.txt\r"
  - type: expect_file
    id: 'w-probe-file-appears-1835'
    path: '/tmp/vimcode-smoke-save-probe-1835.txt'
    contains: 'VIMCODE_SMOKE_SAVE_PROBE_1835'
    timeout_ms: 5000

  # 1b. Bare `:w` -> `expect_file`. The issue's step 1 literally names
  # `:w`, not `:saveas` -- this covers the real "typing -> `:w` -> file on
  # disk" gesture a user performs after `:saveas` has already named the
  # buffer (a bare `:w` with no prior `:saveas` would be launch-dependent;
  # see the comment above). Appends a NEW marker suffix before saving so
  # this check is self-invalidating: a leftover file from an earlier run
  # (or from the `:saveas` probe just above, within this same run) would
  # be missing the `_WBARE` suffix and fail `contains` -- it can only pass
  # if this `:w` actually just wrote the buffer.
  - type: key
    id: 'w-bare-probe-append-key-1835'
    key: 'A'
  - type: type_text
    id: 'w-bare-probe-append-text-1835'
    text: '_WBARE'
  - type: key
    id: 'w-bare-probe-esc-1835'
    key: 'esc'
  - type: expect_within
    id: 'w-bare-probe-landed-1835'
    text: 'VIMCODE_SMOKE_SAVE_PROBE_1835_WBARE'
    ms: 5000
  - type: type_text
    id: 'w-bare-probe-write-command-1835'
    text: ":w\r"
  - type: expect_file
    id: 'w-bare-probe-file-appears-1835'
    path: '/tmp/vimcode-smoke-save-probe-1835.txt'
    contains: 'VIMCODE_SMOKE_SAVE_PROBE_1835_WBARE'
    timeout_ms: 5000

  # 2. `:term` probe -> `expect_file`. Mirrors
  # `tests/conpty_term_opens_shell_1829.rs`'s own real-ConPTY probe
  # exactly (same marker/echo shape, same `[1]`
  # `PANEL_OPEN_NEEDLE`/`term_ex_command_paints_bracketed_tab_label_not_uppercase_terminal`
  # precondition this file's own `explorer-toolbar-owns-row-1-1736`-style
  # reasoning already relies on elsewhere), but over a real Unix pty
  # instead of Windows ConPTY: `:term` + Enter, wait for the terminal
  # toolbar's own "[1]" tab label, then an `echo <marker> > <path>` typed
  # straight into the nested shell, polled for on the real filesystem --
  # proof the shell inside the panel actually ran the command, not merely
  # that something painted.
  - type: type_text
    id: 'term-probe-open-1835'
    text: ":term\r"
  - type: expect_within
    id: 'term-probe-panel-open-1835'
    text: '[1]'
    ms: 20000
  - type: wait_idle
    id: 'term-probe-settle-1835'
    ms: 500
    timeout_ms: 5000
  - type: type_text
    id: 'term-probe-echo-1835'
    text: "rm -f /tmp/vimcode-smoke-term-probe-1835.txt && echo VIMCODE_SMOKE_TERM_PROBE_1835 > /tmp/vimcode-smoke-term-probe-1835.txt\r"
  - type: expect_file
    id: 'term-probe-file-appears-1835'
    path: '/tmp/vimcode-smoke-term-probe-1835.txt'
    contains: 'VIMCODE_SMOKE_TERM_PROBE_1835'
    timeout_ms: 20000

  # 3. Extension install -> `expect_file` on its installed directory (the
  # "can a user install plugins" check) -- reusing the still-open
  # terminal pane from step 2, the same way `EXTENSIONS.md`'s own "Local
  # Extension Development" quick-start describes installing a
  # script-only extension: `mkdir -p ~/.config/vimcode/extensions/<name>`
  # plus a `manifest.toml` (`name`/`display_name` are the two fields
  # `ExtensionManifest` in `src/core/extensions.rs` requires). Deliberately
  # NOT `:ExtInstall <name>` -- that ex-command targets the LSP/DAP
  # *registry* install path (`src/core/tool_acquire.rs`), which needs a
  # real network fetch and is not this probe's concern (nor deterministic
  # in an isolated-HOME smoke run).
  #
  # `~` resolves against THIS process's own `$HOME` (`coord`'s own
  # `expect_file`/`native_fs_wait.wait_for_file`, not the pty child's --
  # see `tui_pty_driver.py`'s own `expect_file` doc) -- the common case,
  # and the one this probe is written for, is both run on the same host
  # with the same `$HOME` (no isolated-HOME override), matching how
  # `coord` actually dispatches this spec in production.
  - type: type_text
    id: 'ext-install-probe-1835'
    text: "rm -rf ~/.config/vimcode/extensions/vimcode-smoke-ext-1835 && mkdir -p ~/.config/vimcode/extensions/vimcode-smoke-ext-1835 && echo 'name = \"vimcode-smoke-ext-1835\"' > ~/.config/vimcode/extensions/vimcode-smoke-ext-1835/manifest.toml && echo 'display_name = \"VimCode Smoke Ext 1835\"' >> ~/.config/vimcode/extensions/vimcode-smoke-ext-1835/manifest.toml\r"
  - type: expect_file
    id: 'ext-install-manifest-appears-1835'
    path: '~/.config/vimcode/extensions/vimcode-smoke-ext-1835/manifest.toml'
    contains: 'vimcode-smoke-ext-1835'
    timeout_ms: 10000

  # Trailing cleanup -- removes every file/directory this section
  # created, both so the NEXT run of this spec starts clean (no stale
  # `/tmp` file or extension directory to mask a future regression as a
  # pass) and so this probe stops permanently installing a bogus
  # extension into the operator's REAL `~/.config/vimcode/extensions/`,
  # which every later `vimcode`/`vcd` launch on this host (including
  # other smoke specs) would otherwise load. Reuses the already-open
  # terminal pane from step 2/3 above -- no new `:term` needed.
  - type: type_text
    id: 'cleanup-probe-1835'
    text: "rm -f /tmp/vimcode-smoke-save-probe-1835.txt /tmp/vimcode-smoke-term-probe-1835.txt && rm -rf ~/.config/vimcode/extensions/vimcode-smoke-ext-1835\r"
  - type: wait_idle
    id: 'cleanup-probe-settle-1835'
    ms: 300
    timeout_ms: 4000

