    key: '0'
  - type: key
    id: 'vim-w-key'
    key: 'w'
  # vim-w-moves-word-forward: 'w' from column 1 lands on 'bar' (column 5)
  - type: expect_within
    id: 'vim-w-moves-word-forward-check'
    text: 'Ln 1, Col 5'
    ms: 5000
  - type: wait_idle
    id: 'vim-w-moves-word-forward-check-settle'
    ms: 350
    timeout_ms: 4000
