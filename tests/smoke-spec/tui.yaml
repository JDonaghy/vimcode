    key: 'esc'
  - type: expect_within
    id: 'rebuild3-line0-landed'
    text: 'foo bar baz'
    ms: 5000
  - type: expect_within
    id: 'rebuild3-line0-normal'
    text: 'NORMAL'
    ms: 3000
  # Rewind to the buffer top: the viewport follows the cursor, so
  # after building the last line via 'o' the earlier lines have
  # scrolled out of view -- 'gg' restores Ln 1 before this journey's
  # own motion/edit begins.
  - type: key
    id: 'rebuild3-rewind-gg1'
    key: 'g'
  - type: key
    id: 'rebuild3-rewind-gg2'
    key: 'g'
