# vimcode#2067: a CI-only, real-display smoke spec for the GTK backend.
#
# `gtk-gui.yaml` in this directory is the sealed, additive-only Tier-2 spec
# that fleet hardware runs during a real acceptance pass, including steps
# gated on AT-SPI accessibility wiring that is not yet live in vimcode's GTK
# backend (see that file's own comments). This file is a separate,
# deliberately small, deterministic journey that a Linux CI runner drives
# under a real Xvfb display (`coord app-drive run-spec gtk-native`, not a
# synthetic-input `GtkDriver` test) -- closing the synthetic-input trust gap
# for the one thing a driver-only test cannot prove: that the real GTK
# window actually opens, becomes the active window under a real window
# manager, and paints real (non-blank, non-tofu) content.
#
# Deliberately avoids `expect_a11y`/`expect_a11y_within`: vimcode's GTK
# a11y tree is not yet populated (tracked separately), so those step types
# would be expected-red here today. It also avoids hardcoding any internal
# widget-layout pixel coordinates -- `expect_region_not_uniform` and
# `expect_no_tofu` below are scoped to a large, centered region that is safe
# regardless of exact chrome layout, because `launch` pins the window to
# (0, 0, width, height).
#
# Not sealed/additive-only: unlike the Tier-2 fleet specs, this file may be
# edited freely as the CI job around it evolves. No explicit quit step is
# needed -- the driver's own teardown kills the process it launched.
name: vimcode-ci-gtk-xvfb
width: 1024
height: 768

steps:
  - type: launch
    id: launch

  - type: wait
    id: startup-settle
    ms: 2000

  - type: expect_frontmost
    id: window-is-frontmost

  - type: expect_region_not_uniform
    id: ui-painted-something
    x: 0
    y: 0
    width: 960
    height: 700

  - type: expect_no_tofu
    id: ui-not-tofu
    x: 0
    y: 0
    width: 960
    height: 700
