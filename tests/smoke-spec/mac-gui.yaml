# Tier-2 macOS-native smoke spec for vimcode#1646 (claude-coordinator epic
# #3482, v0.5.551's new real-platform acceptance drivers).
#
# Driver: `mac-native` (coord/mac_native_driver.py) — launches the real
# vimcode `.app`/binary, finds its real window, and probes it with real
# `CGEvent` input injection, the Accessibility (AX) tree, and
# `screencapture -l <windowid>`. `coord` supplies the actual
# `launch_command`/`cwd`; this file assumes that command opens a small,
# real, non-empty text file (so the minimap-content check below has
# something to show).
#
# Unlike Win-GUI (`tests/smoke-spec/win-gui.yaml`, which draws its own menu
# row into the window's client area with no native menu at all —
# #1629/quadraui#1228), macOS keeps a genuinely **native** menu bar
# (`quadraui`'s `MacBackend::backend_caps()` is the one backend that still
# declares `native_menu: true`) and genuinely native traffic-light window
# buttons (`quadraui/src/macos/run.rs`'s `window_style_mask`: `Titled |
# Closable | ...` with `titlebarAppearsTransparent`/`fullSizeContentView`
# for the custom-painted titlebar *background*, while "the native traffic
# lights float on top of it" — that file's own comment). Both are real
# AppKit controls, so (unlike the Win-GUI dropdown/caption buttons) they
# are already Accessibility-visible without any of the custom AT-provider
# wiring docs/PENDING_QUADRAUI_ISSUES.md's "No UIA/NSAccessibility/AT-SPI
# provider wiring..." entry describes being missing for vimcode's own
# *drawn* content. The menu-bar and close-button checks below are
# therefore expected GREEN today, not expected-red regression guards —
# this file's only expected-red seed checks are the two "All GUI specs"
# ones shared with every other platform.
#
# `move_window` (`NativeRunner._do_launch`) positions the window's top-left
# at screen `(0, 0)`. A `CGEventPost` click is a real *screen*-coordinate
# injection regardless of window z-order, so a small `y` (within the
# macOS menu bar's own ~22px height) lands on the always-on-top global
# menu bar even though the app's own window renders underneath/behind it
# there — this is what lets a `mac-native` click reach "File" at all.
# `x` for "File" (the first real menu after the Apple logo and the bold
# application-name menu) is a first-approximation guess, NOT yet confirmed
# against a real running `vimcode` process's actual menu-bar layout on
# real macOS hardware (macmini) — the real run this issue's acceptance bar
# requires must confirm or correct it.
name: vimcode-mac-gui
width: 1024
height: 768
steps:
  - type: launch
    id: launch
    timeout_ms: 15000

  - type: wait
    id: startup-settle
    ms: 1500

  # Real native global menu bar — `AXRoleAttribute` for a top-level menu
  # bar entry is literally `AXMenuBarItem` (not the Win32/UIA
  # `LocalizedControlType` spelling `win-gui.yaml`/`win-terminal.yaml` use;
  # each native driver's `role:` is whatever string the real OS actually
  # returns, never a shared vocabulary across platforms).
  - type: expect_a11y
    id: native-menu-bar-has-file-item
    role: AXMenuBarItem
    name: File

  - type: click
    id: click-file-menu-item
    x: 95
    y: 11
  - type: expect_a11y_within
    id: file-dropdown-opens
    role: AXMenuItem
    name: "New Tab"
    timeout_ms: 3000

  - type: key
    id: dismiss-dropdown
    key: esc

  # All-GUI-specs seed check: the minimap must show real content for a
  # non-empty file (it painted blank on Windows; this spec checks the same
  # class of regression on macOS). No coord native driver's current step
  # vocabulary has a pixel-content assertion primitive — see
  # `win-gui.yaml`'s identical comment for the full reasoning. Evidence-
  # only: this `capture` step records a `screencapture` image on failure
  # but is not itself a pass/fail oracle for "is the minimap blank".
  - type: capture
    id: minimap-content-evidence-only-not-yet-a-real-assertion

  # All-GUI-specs seed check: the extension-install flow must reach a
  # completed state within a budget (it hung on both Windows and macOS).
  # Same evidence-only caveat as the minimap check above — no AX element
  # exists yet for the extensions list's own install-state text.
  - type: capture
    id: extension-install-completes-evidence-only-not-yet-a-real-assertion

  # Real native traffic-light close button.
  - type: click
    id: click-close-button
    x: 20
    y: 20
  - type: expect_closed
    id: close-button-actually-closes-window
    timeout_ms: 5000
