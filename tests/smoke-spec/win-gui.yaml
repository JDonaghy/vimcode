    x: 600
    y: 16
    ht: HTCAPTION
  - type: expect_hit
    id: hit-test-blank-strip-d-1661
    x: 700
    y: 16
    ht: HTCAPTION
  - type: expect_hit
    id: hit-test-blank-strip-e-1661
    x: 750
