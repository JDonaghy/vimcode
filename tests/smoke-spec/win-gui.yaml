  #
  # #1657: these x values are now known stale (derived before the Command
  # Center existed) but are left exactly as originally authored per this
  # file's additive-only policy (see this file's "#1657" header section) —
  # the corrected `-1657` steps below carry the current, real-hardware
  # x values instead.
  - type: expect_hit
    id: hit-test-file-menu-item-1232
    x: 24
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-edit-menu-item-1232
    x: 75
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-view-menu-item-1232
    x: 126
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-go-menu-item-1232
    x: 177
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-run-menu-item-1232
    x: 228
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-terminal-menu-item-1232
    x: 279
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-help-menu-item-1232
    x: 330
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-minimize-button-1232
    x: 886
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-maximize-button-1232
    x: 932
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-close-button-1232
    x: 978
    y: 16
    ht: HTCLIENT

  # vimcode#1656 ADDS this step rather than touching the one above (this
  # file is additive-only, #3509/#3487) — it remeasured the close button's
  # real click centre against a real 4x-zoom crop of the painted glyph
  # (`/tmp/crop-zoom-caption.png` in that issue's evidence) rather than
  # this header's derived estimate: 994, not 978. Confirmed FAIL
  # (HTCAPTION) at that exact point too, so the gap isn't "the old
  # estimate missed the button by a few px" — the whole caption-button
  # strip is misclassified, both the original derived estimate and this
  # remeasured real centre.
  - type: expect_hit
    id: hit-test-close-button-remeasured-1656
    x: 994
    y: 16
    ht: HTCLIENT

  # The empty band between the menu row and the caption buttons — no widget
  # is painted there, so it must stay the window's drag handle.
  #
  # #1657: this assumption is now KNOWN stale — the Command Center's
  # search box paints at this x today, so a real run is expected to FAIL
  # this step (`got=HTCLIENT want=HTCAPTION`). Left unmodified per this
  # file's additive-only policy; see this file's "#1657" header section
  # for why, and see `hit-test-search-box-is-client-1657` below for the
  # corrected, currently-true expectation at the same x.
  - type: expect_hit
    id: hit-test-empty-band-is-caption-1232
    x: 620
    y: 16
    ht: HTCAPTION

  # #1657: corrected, additive re-derivation of the ten `-1232` hit-test
  # steps above, per this file's "#1657" header section. x values: File
  # from the real-hardware PrintWindow remeasurement (real span ≈55-88);
  # Edit/View/Go/Run/Terminal/Help from the Tier-1 GTK/Win-GUI conformance
  # pair's shared-layout-code painted centers (UNVERIFIED on real Windows
  # hardware beyond File); the three caption buttons from the real-hardware
  # remeasurement (≈914/954/994) — UNRESOLVED whether these three alone
  # fix the caption-button hit-test; see that section before reading a
  # future PASS/FAIL here as conclusive.
  - type: expect_hit
    id: hit-test-file-menu-item-1657
    x: 70
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-edit-menu-item-1657
    x: 114
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-view-menu-item-1657
    x: 165
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-go-menu-item-1657
    x: 211
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-run-menu-item-1657
    x: 253
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-terminal-menu-item-1657
    x: 319
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-help-menu-item-1657
    x: 388
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-minimize-button-1657
    x: 914
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-maximize-button-1657
    x: 954
    y: 16
    ht: HTCLIENT
  - type: expect_hit
    id: hit-test-close-button-1657
    x: 994
    y: 16
    ht: HTCLIENT

  # #1657: x=620 — the old `-1232` "empty band, must stay HTCAPTION"
  # assumption above — now lands inside the Command Center's search box
  # (confirmed both by a real-hardware PrintWindow capture and by the
  # Tier-1 GTK conformance test's painted `search_bounds`), a real,
  # clickable widget. Added beside (not instead of) the old step per this
  # file's additive-only policy: per
  # `quadraui::CommandCenterLayout::hit_regions`, only the back/forward
  # arrows and the search box register as HTCLIENT inside the Command
  # Center's span — the thin blank padding around them (if any survives on
  # real Win-GUI's own font metrics) is too fragile a target to pin a
  # coordinate to without a dedicated real-hardware remeasurement, which
  # this fix's Linux worktree cannot perform.
  - type: expect_hit
    id: hit-test-search-box-is-client-1657
    x: 620
    y: 16
    ht: HTCLIENT

  # #1629/quadraui#1228 (already in the pin, confirmed by the rev check
  # above): Win-GUI switched back to the same *drawn* menu row GTK/TUI
  # already use — no native HMENU is attached any more. Expected GREEN
  # today (this is the one check in this file that is NOT gated on #1232).
  - type: expect_menu
    id: no-native-win32-menu-1228
    items: ["File"]

  # Blocked on quadraui#1232 (the click never lands) AND on the separate,
  # lower-level gap docs/PENDING_QUADRAUI_ISSUES.md's "No UIA/
  # NSAccessibility/AT-SPI provider wiring..." entry describes: vimcode
  # paints its dropdown into the same HWND's client area rather than a
  # separate child window, so even once #1232 lands, nothing registers a
  # `MenuItem`-role UIA element for the drawn dropdown's own content.
  # Expected RED on today's develop for both reasons; do not close this
  # issue's "File opens its dropdown" acceptance item on #1232 landing
  # alone — the UIA gap needs its own fix first.
  # `role:` here is UIA's `LocalizedControlType` string for a menu item,
  # which (per Microsoft's own default English localization) is the
  # two-word, lowercase "menu item", NOT "MenuItem" — `_find_a11y_match`
  # (shared by every coord native driver) does an exact, case-insensitive
  # match against the real OS string, so getting this wrong silently turns
  # a real check into one that can never pass even once the underlying bug
  # is fixed. The real dell64 run must confirm this exact string.
  #
  # UPDATE (vimcode#1656): quadraui#1232 landed and the click itself now
  # lands (real-hardware re-run confirmed: the dropdown genuinely opens and
  # paints "New Tab" — see `/tmp/vimcode-filemenu.png` in that issue's
  # evidence). What's still blocked is the separate, lower-level UIA-wiring
  # gap described above — vimcode paints its dropdown into the same HWND's
  # client area rather than a separate child window, so nothing registers a
  # `MenuItem`-role UIA element regardless of the click landing. This step
  # is therefore still expected RED, but for the UIA-wiring reason alone
  # now, not for #1232's reason too. Left unmodified below.
  #
  # UPDATE (vimcode#1673): an independent bugbash reproduction — twice,
  # with window focus explicitly confirmed (`GetForegroundWindow() ==
  # target hwnd`) immediately before the click — found this exact click
  # swallowed again: `WM_NCHITTEST` at (24,16) correctly reports
  # `HTCLIENT`, but no dropdown paints and no UIA `New Tab` element ever
  # appears (3000ms timeout). This is NOT a reopening of quadraui#1232
  # (that hit-test classification is still confirmed correct) and no new
  # quadraui-side defect was found for it — see `src/win/mod.rs`'s new
  # `#1673` doc section for the full source + empirical investigation. It
  # is the SAME gap vimcode#1657 already diagnosed from the opposite
  # direction (a stale `expect_hit` sweep): x=24 is stale, landing in
  # blank padding left of "File"'s real painted bounds at this window
  # width, not on the label itself — the once-GREEN result the #1656
  # UPDATE above recorded for this exact step no longer reflects the
  # current title-band layout (the app-icon slot and/or Command Center
  # have since shifted every menu-row item right of x=24). This step is
  # therefore expected RED again, for #1657's reason, and the corrected
  # `-1657` click/expect pair below (x=70) is this file's live acceptance
  # coverage going forward — re-run it specifically to confirm the fix on
  # real hardware; do not read a future flip back to GREEN on *this*
  # x=24 step as evidence the stale-coordinate explanation was wrong.
  - type: click
    id: click-file-menu-item-1232
    x: 24
    y: 16
  - type: expect_a11y_within
    id: file-dropdown-opens-1232
    role: "menu item"
    name: "New Tab"
    timeout_ms: 3000

  - type: key
    id: dismiss-dropdown
    key: esc

  # #1657: corrected, additive re-run of the click-and-open sequence above
  # at the real File label x (see this file's "#1657" header section) —
  # the `-1232` click above never reaches the drawn menu even setting
  # #1232 aside, since x=24 lands in blank menu-row padding left of the
  # real label.
  - type: click
    id: click-file-menu-item-1657
    x: 70
    y: 16
  - type: expect_a11y_within
    id: file-dropdown-opens-1657
    role: "menu item"
    name: "New Tab"
    timeout_ms: 3000

  - type: key
    id: dismiss-dropdown-1657
    key: esc

  # vimcode#1646's two "All GUI specs" seed checks — "the minimap shows
  # content for a non-empty file" and "the extension-install flow reaches a
  # completed state within a budget" — are DELIBERATELY OMITTED from this
  # file rather than represented by a bare `capture` step.
  #
  # A bare `capture` step (confirmed against `win_native_driver.py`'s own
  # `_REQUIRED_FIELDS`/step-execution code: `capture` takes a `PrintWindow`
  # snapshot and attaches it to its OWN step result, pass or fail, but has
  # no `expect_*` shape and therefore no condition that can ever fail) is
  # not a real assertion — CLAUDE.md's "a test that cannot fail is not
  # coverage" rule (#553) applies to it directly. A prior version of this
  # file shipped exactly that placeholder; this revision removes it rather
  # than keep a check that always "passes" on the books.
  #
  # Confirmed directly against `coord`'s real `win_native_driver.py`
  # (installed `code-coordinator==0.5.551`, the same version pinned by this
  # issue): its full step vocabulary is `launch`, `key`, `click`, `wait`,
  # `capture`, `expect_menu`, `expect_hit`, `expect_a11y`/
  # `expect_a11y_within`, `expect_closed`, plus the terminal-mode-only
  # `expect_idle_stable`/`expect_menu_latency`/`expect_panel_switch`. None
  # of these can observe "did the minimap paint non-blank pixels" or "did
  # the extensions list reach an install-complete state" — the former needs
  # a pixel-sampling primitive (e.g. an `expect_capture_nonblank`-shaped
  # step comparing a sub-rectangle of a `PrintWindow` capture against a
  # blank-color threshold), the latter needs either the same pixel
  # primitive pointed at the extensions list, or a UIA/AX element exposing
  # the install-state text — and vimcode has no AT-provider wiring for any
  # of its own drawn content yet (`docs/PENDING_QUADRAUI_ISSUES.md`'s "No
  # UIA/NSAccessibility/AT-SPI provider wiring..." entry).
  #
  # Per this issue's own review guidance: "needs either a real primitive
  # added driver-side first ... or some other oracle, not a capture step
  # that cannot go red." No such primitive exists in the installed driver
  # and no other oracle is reachable from vimcode/quadraui alone, so these
  # two seed checks are held back from every GUI spec (mirrored in
  # `mac-gui.yaml`/`gtk-gui.yaml`) until one of:
  #   (a) `coord`'s win/mac/gtk-native drivers grow a pixel-content or
  #       install-state-aware primitive (coordinator-repo work — this repo
  #       must not add it, same as it must not edit `coordinator.yml`), or
  #   (b) vimcode/quadraui ship real AT-provider wiring for drawn content,
  #       which would let `expect_a11y_within` cover the extension-install
  #       case (the minimap would still need (a) — it has no text content
  #       to expose via an accessible name).
  # Track the follow-up primitive as a new claude-coordinator issue; this
  # vimcode PR cannot itself open one (vimcode workers don't file issues in
  # other repos).
  #
  # vimcode#1676 ("the minimap strip renders solid white instead of the
  # active theme") is the same gap this comment already describes, from
  # the opposite direction: that report needs "did the minimap paint the
  # *themed background*, not raw white" rather than "did it paint any
  # non-blank pixels at all" — still an `expect_capture_nonblank`-shaped
  # (or stricter, colour-comparing) primitive this driver doesn't have.
  # See `docs/PENDING_QUADRAUI_ISSUES.md`'s matching #1676 entry and
  # `src/win/mod.rs::win_driver_tests::
  # minimap_strip_background_matches_theme_once_a_surface_is_attached_1676`
  # for the Tier-1 coverage this repo *can* add without that primitive.
  #
  # vimcode#1696 (editor text not inset by the minimap strip; tab-strip
  # overflow-action toolbar clipped off the window's right edge) hits the
  # identical driver-vocabulary wall from a third direction: its own
  # acceptance bar ("no glyph pixels painted within the minimap strip's
  # x-range"; "the tab-strip toolbar's right edge is strictly inside the
  # window") needs exactly the same colour/content-aware pixel primitive
  # this comment already names as missing, plus a known-long buffer line
  # to probe against (this spec's seed file is "small", per this file's own
  # header, not "has a line wide enough to overflow the pane"). See
  # `docs/PENDING_QUADRAUI_ISSUES.md`'s two matching #1696 entries — both
  # root-caused to quadraui-side gaps (`Editor`/`EditorPaintOptions` has no
  # way to reserve trailing content width independently of the scrollbar
  # anchor; `TabBar::layout`'s right segments have no outer-edge inset,
  # unlike `StatusBar`'s `PIXEL_EDGE_INSET`) — and `src/render.rs::render::
  # tests::to_q_editor_does_not_narrow_the_viewport_for_the_minimap_strip_
  # 1696` for the backend-neutral (runs on any host, no driver needed) test
  # that pins the first gap numerically.

  # quadraui#1232 again — the close button's click is swallowed the same
  # way the menu row's is.
  #
  # UPDATE (vimcode#1656): NOT quadraui#1232 any more (that fixed the menu
  # row's equivalent click) — this is the follow-up bug vimcode#1656 found
  # and `docs/PENDING_QUADRAUI_ISSUES.md` drafts: `WinBackend::
  # register_status_bar_segment_zones` registers the close button's
  # *bar-local* bounds as if they were absolute, so the real click still
  # lands as HTCAPTION. Left unmodified below — still this issue's real-
  # click acceptance coverage. vimcode#1656 does NOT add a second
  # click/expect_closed pair at the remeasured 994 centre: a hit-test is
  # side-effect-free and safe to duplicate (see
  # `hit-test-close-button-remeasured-1656` above), but a second real click
  # is not — once this bug is fixed upstream and the click below genuinely
  # closes the window, a second click step targeting an already-closed
  # window would error the driver rather than cleanly pass or fail. The
  # hit-test sweep in this file's header comment already confirms x=978
  # (this existing step's own coordinate) sits inside the same
  # misclassified HTCAPTION strip as the remeasured 994 centre, so this one
  # step is already this issue's real-click acceptance coverage without
  # needing a duplicate.
  #
  # #1657 revisits that last call: it DOES add the second click/
  # expect_closed pair at 994 below, because this issue's remeasurement
  # makes x=978 a coordinate that is expected to *miss* the real button
  # rather than hit a misclassified one — so the `-1232` pair above is
  # expected to leave the window open, and the `-1657` pair is reached
  # with a live window. If the upstream fix ever makes the `-1232` click
  # genuinely close the window, the `-1657` pair below becomes the
  # already-closed-window case #1656 warned about and should be revisited
  # then (a deliberate future call, not a silent edit now).
  - type: click
    id: click-close-button-1232
    x: 978
    y: 16
  - type: expect_closed
    id: close-button-actually-closes-window-1232
    timeout_ms: 5000

  # #1657: corrected, additive re-run of the close-button click above at
  # the real close-button x (see this file's "#1657" header section) —
  # still UNRESOLVED whether the corrected x alone makes the click land;
  # re-confirm on real hardware before reading a future PASS here as proof
  # it does. Only reached if the `-1232` step above left the window open
  # (its own expectation is that it will, since x=978 misses the real
  # button).
  - type: click
    id: click-close-button-1657
    x: 994
    y: 16
  - type: expect_closed
    id: close-button-actually-closes-window-1657
    timeout_ms: 5000

  # #1661: the blank strip between the last menu label and the
