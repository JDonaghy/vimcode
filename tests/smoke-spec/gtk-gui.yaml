# Tier-2 Linux/GTK-native smoke spec for vimcode#1646 (claude-coordinator
# epic #3482, v0.5.551's new real-platform acceptance drivers).
#
# Driver: `gtk-native` (coord/gtk_native_driver.py) — launches the real
# compiled `vimcode` GTK binary under a real (if headless) X11 display,
# finds its real window, and probes it with real `xdotool` input
# injection, the AT-SPI accessibility tree, and `xwd -id <windowid>`
# captures. Needs a live `$DISPLAY` plus `xdotool`/`xwd`/the AT-SPI
# GObject-introspection binding on whatever fleet host runs this — see
# that driver module's own "headless by construction" note; this spec
# does not start its own `Xvfb`. `coord` supplies the actual
# `launch_command`/`cwd`; this file assumes that command opens a small,
# real, non-empty text file (kept non-empty for parity with the other
# Tier-2 specs and so a future minimap-content check — see this file's
# "DELIBERATELY OMITTED" comment below — has something to show once one
# exists).
#
# Unlike macOS (`tests/smoke-spec/mac-gui.yaml`), GTK has no native menu
# bar or native window-chrome buttons to lean on: `quadraui`'s
# `GtkBackend::backend_caps()` does not declare `native_menu` (confirmed
# via `src/gtk/testing.rs`'s own "GTK has no native context menu"
# assertions), and vimcode calls `WindowControl::set_decorated(false)`
# on its GTK window (`src/app.rs`) for the same client-side-decorations,
# custom-painted-chrome reason Win-GUI does — "the same [drawn menu] row
# GTK already ships" that the quadraui#1228 commit message (quoted in
# `win-gui.yaml`) points at when describing what Win-GUI switched back
# to. Every click/menu/dropdown check below is therefore gated the exact
# same way Win-GUI's dropdown check is (not its hit-test-specific
# #1232 bug — GTK was not reported broken there — but the shared,
# lower-level docs/PENDING_QUADRAUI_ISSUES.md "No UIA/NSAccessibility/
# AT-SPI provider wiring..." gap: nothing registers an `AtkObject`/AT-SPI
# provider for any of vimcode's own drawn content on any platform).
#
# Pixel coordinates are first-approximation (same ~32px drawn-band-height
# convention `win-gui.yaml` uses, since GTK paints the identical row).
#
# UNLIKE `win-gui.yaml`/`win-terminal.yaml` (real-hardware-confirmed via WSL
# interop to dell64's attached Windows host), this file has NOT had a real
# run: `gtk-native`'s own driver needs `xdotool`/`xwd` plus a live `$DISPLAY`
# and the AT-SPI GObject-introspection binding (see this file's driver
# paragraph above); the sandboxed Linux worktree this fix iteration ran in
# has `at-spi2-core`'s D-Bus pieces installed but neither `xdotool` nor
# `Xvfb`, and no passwordless `sudo` to install them. Saying so explicitly
# rather than leaving the coordinates looking confirmed — they remain
# first-approximation guesses pending an operator with a real (or
# `Xvfb`-provisioned, package-installable) Linux desktop running this spec
# and recording pass/fail back into this comment.
#
# ── vimcode#1835 update (2026-10-09): typing/`:term`/extension-install/
#    `expect_frontmost`/`expect_region_not_uniform` probes added (see the
#    new `-1835`-suffixed section before the `click-close-button` pair
#    below) ───────────────────────────────────────────────────────────────
#
# This update inherits the paragraph above's own "has NOT had a real run"
# status, unchanged: this issue's worktree is a macOS host with no Linux
# box, container runtime, or fleet SSH access reachable from it, and
# `gtk_native_driver.py`'s own `LinuxGtkCalls` construction-time-raises on
# any non-Linux platform (`GtkNativeRuntimeError`, by design — see that
# module's docstring), so `coord app-drive run-spec gtk-native` cannot even
# start here to attempt validation. Every step in the new `-1835` section
# was instead validated the way this repo's own convention requires for a
# step that genuinely cannot be exercised locally: cross-checked against
# the exact same marker/echo/`:saveas` shapes this issue's companion
# `tests/smoke-spec/tui.yaml` `-1835` section already ran clean, real, over
# a real pty (see that file's own header) — the `type_text`/`key`/
# `expect_file` semantics are the one piece shared verbatim across every
# Tier-2 native driver (`coord.native_fs_wait`, #2096 "one question, one
# answer"), so a real pass there is strong (not equivalent-to-a-real-run)
# evidence this section's own non-pixel steps are correct. The two
# `expect_region_not_uniform` pixel bands remain first-approximation
# guesses with no cross-check available at all. None of this section is
# "done" by this issue's own bar ("the spec has actually run on the real
# host") until a Linux/GTK operator runs it — tracked in PROJECT_STATE.md.
name: vimcode-gtk-gui
width: 1024
height: 768
steps:
  - type: launch
    id: launch
    timeout_ms: 15000

  - type: wait
    id: startup-settle
    ms: 1500

  # Gated on docs/PENDING_QUADRAUI_ISSUES.md's AT-provider-wiring entry —
  # expected RED today, same reasoning as `win-gui.yaml`'s identical
  # check (minus that file's additional #1232 hit-test gate, which is
  # Win-GUI-specific). No `-NNNN` issue suffix on `file-dropdown-opens`
  # (unlike `win-gui.yaml`'s `-1232`) for the same reason `mac-gui.yaml`
  # notes on its own identical check: the AT-provider-wiring gap is
  # drafted in that doc but not yet filed as a numbered quadraui issue.
  - type: click
    id: click-file-menu-item
    x: 24
    y: 16
  - type: expect_a11y_within
    id: file-dropdown-opens
    role: "menu item"
    name: "New Tab"
    timeout_ms: 3000

  - type: key
    id: dismiss-dropdown
    key: esc

  # ─────────────────────────────────────────────────────────────────────
  # vimcode#1835 -- Linux "first five minutes" smoke: typing, `:term`, and
  # extension-install probes, plus `expect_frontmost`/
  # `expect_region_not_uniform` -- the driver steps `gtk-native` gained for
  # exactly this purpose (claude-coordinator#3650). Additive (#3509): every
  # existing step above is unchanged. Placed here (before the pre-existing
  # `click-close-button`/`close-button-actually-closes-window` pair below,
  # not appended after it) because that pair's own job is closing the
  # window — this section needs it still open, and #3509's "don't rewrite
  # an existing step" bar does not require literally moving to the very
  # end of the file when the existing last step is itself a teardown
  # action.
  #
  # UNCONFIRMED pixel geometry (same caveat this file's own header already
  # states for every `click`/`expect_a11y` step above): no real Linux/X11
  # host was available to run this section from this issue's worktree.
  # The `terminal-panel-not-uniform-1835`/`minimap-not-uniform-1835` bands
  # below are derived from `src/render.rs`'s own layout constants
  # (`activity_bar_width_px = 48.0`, `TAB_ROW_HEIGHT_PX = 35.0`,
  # `BREADCRUMB_ROW_HEIGHT_PX = 22.0`, `MINIMAP_WIDTH_FRACTION = 0.15` of
  # the editor pane, clamped to `[MINIMAP_MIN_PX, MINIMAP_MAX_PX] = [48,
  # 240]` px), not a real `xwd` capture — first-approximation guesses,
  # same status this file's header already gives the `click-file-menu-item`
  # coordinates. Needs an operator with a real (or Xvfb-provisioned) Linux
  # desktop to run this section and record pass/fail back into this
  # comment — see PROJECT_STATE.md. The `expect_file`/`expect_frontmost`
  # steps below have no pixel-geometry guesswork in them and are expected
  # to be reliable on a real run; only the two `expect_region_not_uniform`
  # bands are first-approximation.

  # 0. `expect_frontmost` -- the vimcode#1824 "app never becomes
  # frontmost" class of bug, checked before any typed input below so a
  # `type_text` step that silently lands on the launching terminal instead
  # (vimcode#1825-class) cannot masquerade as a pass.
  - type: expect_frontmost
    id: launch-is-frontmost-1835

  # 1. Typing -> `:w` -> `expect_file`: a real user gesture (insert text,
  # Escape, save to an explicit path) must actually land the typed text on
  # disk. Uses `:saveas <path>`, not a bare `:w <path>` — see
  # `tests/smoke-spec/tui.yaml`'s own `-1835` section for why (a real-pty
  # run found vimcode's `:w` ignores a trailing path argument; `:saveas`
  # is the command that actually implements "write to this explicit new
  # path").
  - type: key
    id: w-probe-insert-1835
    key: i
  - type: type_text
    id: w-probe-type-text-1835
    text: "VIMCODE_SMOKE_SAVE_PROBE_1835_GTK"
  - type: key
    id: w-probe-esc-1835
    key: esc
  - type: key
    id: w-probe-colon-1835
    key: ':'
  - type: type_text
    id: w-probe-write-command-1835
    text: "saveas /tmp/vimcode-smoke-save-probe-1835-gtk.txt"
  - type: key
    id: w-probe-enter-1835
    key: enter
  - type: wait
    id: w-probe-settle-1835
    ms: 500
  - type: expect_file
    id: w-probe-file-appears-1835
    path: "/tmp/vimcode-smoke-save-probe-1835-gtk.txt"
    contains: "VIMCODE_SMOKE_SAVE_PROBE_1835_GTK"
    timeout_ms: 5000

  # 2. `:term` probe -> `expect_file`: same marker/echo shape as
  # `tests/smoke-spec/tui.yaml`'s own `-1835` section and
  # `tests/conpty_term_opens_shell_1829.rs` — proof the shell inside the
  # panel actually ran the command, not merely that something painted.
  - type: key
    id: term-probe-colon-1835
    key: ':'
  - type: type_text
    id: term-probe-command-1835
    text: "term"
  - type: key
    id: term-probe-enter-1835
    key: enter
  - type: wait
    id: term-probe-open-settle-1835
    ms: 1000
  - type: type_text
    id: term-probe-echo-1835
    text: "echo VIMCODE_SMOKE_TERM_PROBE_1835_GTK > /tmp/vimcode-smoke-term-probe-1835-gtk.txt"
  - type: key
    id: term-probe-echo-enter-1835
    key: enter
  - type: expect_file
    id: term-probe-file-appears-1835
    path: "/tmp/vimcode-smoke-term-probe-1835-gtk.txt"
    contains: "VIMCODE_SMOKE_TERM_PROBE_1835_GTK"
    timeout_ms: 20000

  # The terminal panel is now open and has really run a shell command --
  # `expect_region_not_uniform` on its own drawn band proves it painted
  # real cell content (prompt/echoed text/cursor), not vimcode#1828's
  # blank panel. First-approximation band (bottom portion of the window,
  # below the status bar, well inside the editor area so it cannot be
  # satisfied by the activity bar/sidebar instead) — see this section's
  # header for the "UNCONFIRMED pixel geometry" caveat.
  - type: expect_region_not_uniform
    id: terminal-panel-not-uniform-1835
    x: 300
    y: 600
    width: 300
    height: 100

  # 3. Extension install -> `expect_file` on its installed directory (the
  # "can a user install plugins" check) -- reuses the still-open terminal
  # pane from step 2, same local-extension-directory flow as
  # `tests/smoke-spec/tui.yaml`'s own `-1835` section (see that file's
  # comment for why not `:ExtInstall`, which targets the LSP/DAP registry
  # install path and needs a real network fetch).
  - type: type_text
    id: ext-install-probe-1835
    text: "mkdir -p ~/.config/vimcode/extensions/vimcode-smoke-ext-1835-gtk && echo 'name = \"vimcode-smoke-ext-1835-gtk\"' > ~/.config/vimcode/extensions/vimcode-smoke-ext-1835-gtk/manifest.toml && echo 'display_name = \"VimCode Smoke Ext 1835 GTK\"' >> ~/.config/vimcode/extensions/vimcode-smoke-ext-1835-gtk/manifest.toml"
  - type: key
    id: ext-install-probe-enter-1835
    key: enter
  - type: expect_file
    id: ext-install-manifest-appears-1835
    path: "~/.config/vimcode/extensions/vimcode-smoke-ext-1835-gtk/manifest.toml"
    contains: "vimcode-smoke-ext-1835-gtk"
    timeout_ms: 10000

  # 4. Minimap `expect_region_not_uniform` -- vimcode#1676's "uniform
  # black-bar minimap" regression class, the exact bug the driver's own
  # module doc names this primitive for. First-approximation band at the
  # editor pane's right edge — see this section's header for the
  # "UNCONFIRMED pixel geometry" caveat.
  - type: expect_region_not_uniform
    id: minimap-not-uniform-1835
    x: 950
    y: 300
    width: 60
    height: 100

  # vimcode#1646's two "All GUI specs" seed checks are DELIBERATELY OMITTED
  # from this file, same as `win-gui.yaml`/`mac-gui.yaml` (see
  # `win-gui.yaml`'s comment for the full reasoning): confirmed directly
  # against `coord`'s installed `gtk_native_driver.py`
  # (`code-coordinator==0.5.551`), its step vocabulary is `launch`, `key`,
  # `click`, `wait`, `capture`, `expect_a11y`/`expect_a11y_within`,
  # `expect_closed` — `capture` alone has no `expect_*` shape, so it can
  # never fail. No pixel-content or install-state-aware primitive exists in
  # this driver to replace it with.

  - type: click
    id: click-close-button
    x: 978
    y: 16
  - type: expect_closed
    id: close-button-actually-closes-window
    timeout_ms: 5000
