# vimcode#1729 -- behaviour catalogue for the cross-platform bug-bash.
#
# This file is the shared contract between `claude-coordinator`'s
# `coord bugbash vimcode` (claude-coordinator#3580) and this repo: a list of
# concrete user journeys with an observable expected outcome, so bugbash can
# drive the real app and judge pass/fail without inventing behaviour or
# needing prior vimcode context. It supplements (does not replace) the
# Tier-2 smoke specs in this same directory (`tui.yaml`, `gtk-gui.yaml`,
# `mac-gui.yaml`, `win-gui.yaml`, `win-terminal.yaml`), which pin exact
# driver steps/coordinates for a handful of previously-reported bugs; this
# file is broader and shallower -- one line of steps, one line of expected
# outcome, no driver-specific coordinates.
#
# `reference` says where `expected` comes from, not the author's opinion:
#   - nvim:     whatever real Neovim does for the same keystrokes on the
#               same buffer (buffer text, cursor, registers). Only features
#               VIM_COMPATIBILITY.md marks (tick) are catalogued here --
#               never a known-unsupported (cross) one.
#   - vscode:   VS Code's own default keybindings (per-OS: Ctrl on
#               Linux/Windows, Cmd on macOS, with documented exceptions
#               called out explicitly in `reference_detail`).
#   - spec:     this repo's own README/docs describing intended behaviour
#               (mode switching, chrome, VSCode-mode specifics without a
#               1:1 VS Code command).
#   - platform: a checkable terminal/OS/rendering fact (Option-as-Meta,
#               ConPTY vs a Unix pty, Nerd Font fallback, truecolor vs
#               256-color, IME positioning, etc.) rather than an app
#               behaviour.
#
# `lanes` are the coordinator's driver kinds (`scripts/validate_smoke_specs.py`
# is the other place these four strings are enumerated): `tui-pty`,
# `win-native`, `mac-native`, `gtk-native`.
#
# Extensions are out of scope for this version (per the issue) -- no
# extension-install or extension-API journeys appear below.
#
# Schema is checked by `tests/smoke_catalogue.rs`: unique `id`s, every
# enum-valued field drawn from a known set, non-empty `steps`/`expected`.
# **Do not run these journeys or fix anything here** -- this file is the
# catalogue only; findings come from an actual bug-bash run afterward.
version: 1
